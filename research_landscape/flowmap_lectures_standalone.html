<style>
/* Layout: Marginalia 学术编辑风。左侧固定讲次目录（宽屏），主栏 + 右侧边注栏；实验图放在主栏里 */
:root {
  --paper: #f5f5f1;
  --ink: #1c2027;
  --muted: #676c76;
  --rule: #d9d9d1;
  --block: #ececE6;
  --accent: #23467a;
  --term-a: #2659b0;
  --term-b: #ad4236;
  --serif: "Source Serif 4", "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  --serif-cn: "Noto Serif SC", "Source Serif 4", "Songti SC", "SimSun", serif;
  --sans: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --rail: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161a; --ink: #e3e3dd; --muted: #989ca5; --rule: #2b2e34;
    --block: #1b1e23; --accent: #93b2e6; --term-a: #7ea7ee; --term-b: #e88b7e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14161a; --ink: #e3e3dd; --muted: #989ca5; --rule: #2b2e34;
  --block: #1b1e23; --accent: #93b2e6; --term-a: #7ea7ee; --term-b: #e88b7e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--serif); font-size: 18px; line-height: 1.75;
  -webkit-font-smoothing: antialiased; margin: 0;
}
.mono { font-family: var(--sans); font-variant-numeric: tabular-nums; }

/* 进度条 */
.progress { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 2px; z-index: 30; }
.progress span { display: block; height: 100%; width: 0; background: var(--accent); }

/* 讲次目录 */
.rail { display: none; }
.topnav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper);
  border-bottom: 1px solid var(--rule);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; font-family: var(--sans); font-size: 13px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--paper); }
.topnav b { font-family: var(--serif-cn); font-size: 15px; font-weight: 600; white-space: nowrap; }
.topnav select { font: inherit; flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink); }
@media (min-width: 1240px) {
  :root { --rail: 248px; }
  .topnav { display: none; }
  .rail {
    display: flex; flex-direction: column; position: fixed; z-index: 20;
    top: env(safe-area-inset-top, 0px); bottom: 0; left: 0; width: var(--rail);
    padding: 40px 18px 24px max(28px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--rule);
    background: var(--paper); overflow-y: auto; font-family: var(--sans);
  }
  .rail-title { font-family: var(--serif-cn); font-weight: 700; font-size: 19px; line-height: 1.35; margin-bottom: 6px; }
  .rail-sub { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 22px; }
  .rail-group { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
  .rail a { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px; padding: 5px 8px; border-left: 2px solid transparent; color: var(--ink); text-decoration: none; font-size: 13.5px; line-height: 1.45; }
  .rail a .n { font-family: var(--serif); font-style: italic; color: var(--muted); }
  .rail a:hover { background: var(--block); }
  .rail a[aria-current="page"] { border-left-color: var(--accent); color: var(--accent); font-weight: 500; }
  .rail a[aria-current="page"] .n { color: var(--accent); }
  .rail-foot { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--muted); line-height: 1.6; }
  .rail-foot a { display: inline; padding: 0; border: 0; color: var(--accent); font-size: 12px; }
  body { padding-left: var(--rail); }
}

.page {
  max-width: 1040px; margin: 0 auto;
  padding-block: 64px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.row { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 56px; align-items: start; }
.main { min-width: 0; }
.aside { min-width: 0; font-family: var(--sans); font-size: 13px; line-height: 1.6; color: var(--muted); padding-top: 6px; }
.aside p { margin: 0 0 12px; }
.aside b { color: var(--ink); font-weight: 600; }

/* 封面 */
.cover { padding-bottom: 40px; border-bottom: 1px solid var(--rule); margin-bottom: 48px; }
.eyebrow { font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 20px; }
h1 { font-family: var(--serif-cn); font-weight: 700; font-size: clamp(32px, 5.4vw, 50px); line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 18px; text-wrap: balance; }
h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--accent); }
.lede { font-size: 20px; color: var(--muted); margin: 0 0 28px; max-width: 34em; }
.byline { font-family: var(--sans); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 22px; }
.byline b { color: var(--ink); font-weight: 500; }
.tagrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.tagrow span { font-family: var(--sans); font-size: 12px; padding: 1px 8px; border: 1px solid var(--rule); border-radius: 2px; color: var(--muted); }

/* 章节 */
section { margin-bottom: 56px; }
h2 { font-family: var(--serif-cn); font-weight: 600; font-size: 26px; line-height: 1.35; margin: 0 0 18px; text-wrap: balance; display: flex; align-items: baseline; gap: 14px; }
h2 .num { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--accent); font-size: 22px; }
h3 { font-family: var(--serif-cn); font-weight: 600; font-size: 19px; margin: 28px 0 10px; }
p { margin: 0 0 18px; max-width: 36em; }
ul.plain { margin: 0 0 18px; padding-left: 1.2em; max-width: 36em; }
ul.plain li { margin-bottom: 6px; }

.thm { border-left: 2px solid var(--accent); padding: 4px 0 4px 22px; margin: 28px 0; }
.thm.def { background: var(--block); padding: 18px 22px; border-radius: 0 4px 4px 0; }
.thm-label { font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.thm-label i { font-family: var(--serif); text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); font-size: 14px; }
.thm p { margin-bottom: 10px; }
.thm p:last-child { margin-bottom: 0; }
.proof { margin: 18px 0 28px; }
.proof .lead { font-style: italic; color: var(--accent); margin-right: 6px; }
.qed { float: right; color: var(--ink); }

.display { overflow-x: auto; overflow-y: hidden; margin: 22px 0; padding: 4px 0; }
mjx-container[display="true"] { margin: 0 !important; }
mjx-container { font-size: 105% !important; }
.ta { color: var(--term-a); }
.tb { color: var(--term-b); }
.hl-a { color: var(--term-a); font-weight: 600; }
.hl-b { color: var(--term-b); font-weight: 600; }
.result { background: var(--block); border-radius: 4px; padding: 10px 18px; }

.derive { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 15em); gap: 14px 28px; align-items: center; margin: 26px 0; padding: 22px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.derive .eq { min-width: 0; overflow-x: auto; overflow-y: hidden; }
.derive .why { font-family: var(--sans); font-size: 13px; color: var(--muted); line-height: 1.5; padding-left: 14px; border-left: 1px solid var(--rule); }
.derive .why b { color: var(--accent); font-weight: 600; }

details { margin: 8px 0 28px; border: 1px solid var(--rule); border-radius: 4px; }
summary { cursor: pointer; list-style: none; font-family: var(--sans); font-size: 14px; font-weight: 500; color: var(--accent); padding: 12px 18px; display: flex; align-items: center; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .2s ease; }
details[open] summary::before { transform: rotate(45deg); }
details > div { padding: 0 18px 14px; }
details .derive { margin: 0; border-bottom: 0; padding: 18px 0; }

pre.algo { font-family: var(--sans); font-size: 13.5px; line-height: 1.75; margin: 22px 0; padding: 14px 18px; border-left: 2px solid var(--rule); overflow-x: auto; white-space: pre; color: var(--ink); background: transparent; }

table.cmp { border-collapse: collapse; font-family: var(--sans); font-size: 13.5px; width: 100%; }
.tablewrap { overflow-x: auto; margin: 22px 0; }
table.cmp th, table.cmp td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.cmp th { font-weight: 600; color: var(--muted); font-size: 12px; letter-spacing: 0.04em; border-bottom-color: var(--ink); }
table.cmp td { font-variant-numeric: tabular-nums; }

.summary { border-top: 2px solid var(--ink); padding-top: 22px; }
.summary ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; counter-reset: s; max-width: 36em; }
.summary li { counter-increment: s; display: grid; grid-template-columns: 2em minmax(0, 1fr); }
.summary li::before { content: counter(s); font-style: italic; color: var(--accent); font-variant-numeric: tabular-nums; }

a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
summary:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 讲次翻页 */
.pager { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-family: var(--sans); }
.pager a { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink); padding: 8px 0; }
.pager a span { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
.pager a b { font-family: var(--serif-cn); font-weight: 600; font-size: 17px; }
.pager a:hover b { color: var(--accent); }
.pager .next { text-align: right; align-items: flex-end; }
footer.foot { margin-top: 40px; font-family: var(--sans); font-size: 12px; color: var(--muted); }

/* 实验 */
figure.lab { margin: 32px 0; padding: 18px 0 16px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-family: var(--sans); }
.lab-head { margin-bottom: 14px; }
.lab-label { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--accent); }
.lab-body { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.lab-plots { min-width: 0; }
.lab-canvas { display: block; width: 100%; max-width: 100%; height: auto; border-radius: 2px; }
.lab-twin { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lab-sub { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.lab-side { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.lab-controls { display: flex; flex-direction: column; gap: 10px; }
.lab-ctl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 13px; color: var(--muted); }
.lab-ctl input[type=range] { grid-column: 1 / -1; grid-row: 2; width: 100%; accent-color: var(--accent); margin: 0; }
.lab-ctl-name { font-size: 13px; color: var(--muted); }
.lab-ctl-val { color: var(--ink); }
.lab-seg { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; width: fit-content; max-width: 100%; }
.lab-seg button { font: inherit; font-size: 12.5px; padding: 5px 10px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.lab-seg button + button { border-left: 1px solid var(--rule); }
.lab-seg button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
.lab-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.lab-key { display: inline-flex; align-items: center; gap: 6px; }
.lab-sw { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; }
.lab-sw.ring { background: transparent; border: 1.2px solid var(--c); }
.lab-sw.line { width: 16px; height: 2px; border-radius: 0; }
.lab-read { border-top: 1px solid var(--rule); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.lab-num { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); align-items: baseline; }
.lab-num b { font-size: 16px; font-weight: 600; color: var(--ink); }
.lab-num b.ta { color: var(--term-a); } .lab-num b.tb { color: var(--term-b); }
.lab-note, .lab-hint { font-size: 12.5px; line-height: 1.6; color: var(--muted); margin: 4px 0 0; max-width: none; }
.lab-note b { color: var(--ink); }
.lab-table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.lab-table th, .lab-table td { padding: 4px 6px; border-bottom: 1px solid var(--rule); text-align: right; }
.lab-table th:first-child { text-align: left; font-weight: 500; color: var(--muted); }
.lab-table thead th { color: var(--muted); font-weight: 500; }
figure.lab figcaption { margin-top: 14px; font-size: 13px; line-height: 1.65; color: var(--muted); max-width: 46em; }
figure.lab figcaption b { color: var(--ink); font-weight: 600; }

.loading { font-family: var(--sans); font-size: 14px; color: var(--muted); padding: 80px 0; }

@media (max-width: 860px) {
  .row { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .aside { border-left: 1px solid var(--rule); padding: 0 0 0 14px; margin: 4px 0 28px; }
  .derive { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .derive .why { border-left: 0; padding: 0 0 12px; }
  .page { padding-block: 40px 80px; }
  body { font-size: 17px; }
  .lab-body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) { .lab-twin { grid-template-columns: minmax(0, 1fr); } .pager { grid-template-columns: minmax(0, 1fr); } .pager .next { text-align: left; align-items: flex-start; } }
@media (prefers-reduced-motion: reduce) { summary::before { transition: none; } }

<script>
// Flow map 精读讲义 · 交互实验
// 所有实验都基于二维高斯混合数据：x ~ Σ_k w_k N(μ_k, S² I)，ε ~ N(0, I)，z_t = (1−t)x + tε（t=1 为噪声，t=0 为数据）。
// 这种数据下后验、边缘速度、条件速度的协方差都有解析式；ODE 流映射用 RK4 数值积分得到。
(function () {
  "use strict";

  /* ---------------- 随机数 ---------------- */
  function rng(seed) {
    let a = seed >>> 0;
    const u = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const n = () => { let x = 0, y = 0; while (x === 0) x = u(); while (y === 0) y = u(); return Math.sqrt(-2 * Math.log(x)) * Math.cos(2 * Math.PI * y); };
    return { u, n };
  }

  /* ---------------- 玩具模型 ---------------- */
  function ring(K, R, phase) { const out = []; for (let k = 0; k < K; k++) { const a = (phase || 0) + 2 * Math.PI * k / K; out.push([R * Math.cos(a), R * Math.sin(a)]); } return out; }
  const MODELS = {
    six: { mus: ring(6, 2.2, Math.PI / 6), S: 0.18 },
    circle: { mus: ring(28, 2.0, 0), S: 0.035 }
  };

  function post(M, z, t) {
    const S2 = M.S * M.S, st2 = (1 - t) * (1 - t) * S2 + t * t, K = M.mus.length;
    const lp = new Array(K); let mx = -Infinity;
    for (let k = 0; k < K; k++) {
      const dx = z[0] - (1 - t) * M.mus[k][0], dy = z[1] - (1 - t) * M.mus[k][1];
      lp[k] = -0.5 * (dx * dx + dy * dy) / st2; if (lp[k] > mx) mx = lp[k];
    }
    let s = 0; for (let k = 0; k < K; k++) { lp[k] = Math.exp(lp[k] - mx); s += lp[k]; }
    const g = (1 - t) * S2 / st2;
    let ex = 0, ey = 0, sxx = 0, sxy = 0, syy = 0;
    for (let k = 0; k < K; k++) {
      const p = lp[k] / s;
      const mxk = M.mus[k][0] + g * (z[0] - (1 - t) * M.mus[k][0]);
      const myk = M.mus[k][1] + g * (z[1] - (1 - t) * M.mus[k][1]);
      ex += p * mxk; ey += p * myk; sxx += p * mxk * mxk; sxy += p * mxk * myk; syy += p * myk * myk;
    }
    const c = S2 * t * t / st2;
    return { ex, ey, cxx: c + sxx - ex * ex, cxy: sxy - ex * ey, cyy: c + syy - ey * ey };
  }
  const EX = (M, z, t) => { const q = post(M, z, t); return [q.ex, q.ey]; };
  const V = (M, z, t) => { const q = post(M, z, t); return [(z[0] - q.ex) / t, (z[1] - q.ey) / t]; };

  const TMIN = 1e-3;
  // 真实流映射 X_{t→r}(z)：从 t 积分到 r（r < t），越靠近 r 步长越细
  function flow(M, z, t, r, N) {
    N = N || 80;
    if (r === t) return [z[0], z[1]];
    if (r > t) { // 反向（往噪声方向）积分，只用于小步长
      let x = z[0], y = z[1]; const n = 12, h = (r - t) / n;
      for (let i = 0; i < n; i++) {
        const a = t + i * h, k1 = V(M, [x, y], a), k2 = V(M, [x + h / 2 * k1[0], y + h / 2 * k1[1]], a + h / 2), k3 = V(M, [x + h / 2 * k2[0], y + h / 2 * k2[1]], a + h / 2), k4 = V(M, [x + h * k3[0], y + h * k3[1]], a + h);
        x += h / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]); y += h / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
      }
      return [x, y];
    }
    const rr = Math.max(r, TMIN);
    let x = z[0], y = z[1];
    let prev = t;
    for (let i = 1; i <= N; i++) {
      const f = 1 - i / N, b = rr + (t - rr) * f * f, a = prev, h = b - a;
      const k1 = V(M, [x, y], a);
      const k2 = V(M, [x + h / 2 * k1[0], y + h / 2 * k1[1]], a + h / 2);
      const k3 = V(M, [x + h / 2 * k2[0], y + h / 2 * k2[1]], a + h / 2);
      const k4 = V(M, [x + h * k3[0], y + h * k3[1]], b);

  /* ======================================================

  /* ======================================================

  /* ======================================================

          const z = i < G * G ? [-3.6 + (i % G + 0.5) * 7.2 / G, -3.6 + (Math.floor(i / G) + 0.5) * 7.2 / G] : zs[i - G * G];

        <div class="lab-num"><span>中位数<\/span><b class="mono">${fmt(q(0.5), 2)}<\/b><\/div>

  /* ======================================================

  /* ======================================================
     实验 F：plug-in 速度估计（ESC）

      const t = +tt.v, Bs = [1, 2, 4, 8, 16, 32, 64, 128, 256], R = rng(41), n = 260, a = [], b = [];

  /* ======================================================

      [top, top + lane].forEach(y => { ctx.strokeStyle = css("rule"); ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(W - 40, y); ctx.stroke(); });

      ctx.fillStyle = css("muted"); ctx.textAlign = "center"; [-4, -2, 0, 2, 4].forEach(v => ctx.fillText(String(v), xm(v), hy + 16));
      let w1 = 0; for (let i = 0; i < out.length; i++) w1 += Math.abs(out[i] - dataT[i]); w1 /= out.length;
      S.read.innerHTML = `<div class="lab-num"><span>输出分布与数据分布的 W₁ 距离<\/span><b class="mono ${w1 < 0.3 ? "ta" : "tb"}">${fmt(w1, 2)}<\/b><\/div><p class="lab-note">直接回归"噪声 → 配对的数据"，学到的是条件均值 E[x | ε]。独立耦合下每个 ε 配到的 x 是随机的，均值就是 0，所有输出塌到中间；批越大，排序配对越接近全局 OT（一维时就是按分位数配对），映射越接近确定性的单调映射。<\/p>`;
    }
    sb.inp.addEventListener("input", draw); draw();
    return { redraw: draw };
  }

  /* ======================================================
     实验 I：有限差分代替 JVP（SoFlow / EMF）
     ====================================================== */
  function labFinite(fig) {
    const M = MODELS.six, S = shell(fig, "实验 · 有限差分步长的取舍");
    const C = Chart(canvas(S.plots, 560, 340, "有限差分误差随步长变化"), 560, 340, { x0: 0.002, x1: 0.3, y0: 1e-4, y1: 10, logx: true, logy: true, xticks: [0.002, 0.01, 0.05, 0.3], yticks: [0.0001, 0.001, 0.01, 0.1, 1, 10], xlabel: "差分步长 h（SoFlow 中的 t − l）", ylabel: "du/dt 的相对误差" });
    const sg = seg([["0.0001", "σ = 10⁻⁴"], ["0.001", "σ = 10⁻³"], ["0.01", "σ = 10⁻²"]], "0.001");
    S.ctl.append(el("span", "lab-ctl-name", "假设网络输出的随机误差 σ"), sg.el, legend([["term-b", "截断误差（真实计算）", "line"], ["muted", "噪声误差 ≈ √2·σ / h", "line"], ["term-a", "两者合计", "line"]]));
    let bias = null, refn = 1;
    function compute() {
      const t = 0.9, r = 0.1, N = 200, zs = sampleZ(M, rng(71), 24, t);
      const hs = [0.002, 0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.25];
      const out = hs.map(() => 0); let rn = 0;
      zs.forEach(z => {
        const e = 2e-4, a = flow(M, z, t, t - e, 6), b = flow(M, z, t, t + e, 6), ua = U(M, a, t - e, r, N), ub = U(M, b, t + e, r, N);
        const ref = [(ub[0] - ua[0]) / (2 * e), (ub[1] - ua[1]) / (2 * e)], u = U(M, z, t, r, N), nr = Math.max(norm(ref), 1e-6); rn += nr;
        hs.forEach((h, i) => { const zl = flow(M, z, t, t - h, 12), ul = U(M, zl, t - h, r, N); out[i] += Math.hypot((u[0] - ul[0]) / h - ref[0], (u[1] - ul[1]) / h - ref[1]) / nr; });
      });
      bias = hs.map((h, i) => [h, out[i] / zs.length]); refn = rn / zs.length; draw();
    }
    function draw() {
      if (!bias) return;
      const s = +sg.v, noise = bias.map(([h]) => [h, Math.SQRT2 * s / h / refn]), tot = bias.map(([h, b], i) => [h, Math.hypot(b, noise[i][1])]);
      C.draw([{ pts: bias, color: "term-b" }, { pts: noise, color: "muted", dash: [4, 3] }, { pts: tot, color: "term-a" }]);
      let best = tot[0]; tot.forEach(p => { if (p[1] < best[1]) best = p; });
      const slope = (Math.log10(bias[bias.length - 1][1]) - Math.log10(bias[0][1])) / (Math.log10(bias[bias.length - 1][0]) - Math.log10(bias[0][0]));
      S.read.innerHTML = `<div class="lab-num"><span>截断误差的斜率（log-log）<\/span><b class="mono tb">${fmt(slope, 2)}<\/b><\/div><div class="lab-num"><span>合计误差最小的步长<\/span><b class="mono ta">h ≈ ${fmt(best[0], 3)}<\/b><\/div>
        <p class="lab-note">截断误差在二维例子里沿真实轨迹算出，约按 h 线性下降；噪声误差是一个假设模型：若网络输出带 σ 的随机误差，差分会把它放大约 √2·σ/h 倍。两者合计呈 U 形。网络越准（σ 越小），最优步长越小，这正是 SoFlow 随训练逐渐缩小步长的道理。<\/p>`;
    }
    sg.on(draw); later(compute);
    return { redraw: draw };
  }

  /* ---------------- 挂载 ---------------- */
  const REG = { collapse: labCollapse, euler: labEuler, equations: labEquations, identity: labIdentity, tangent: labTangent, delta: labDelta, plugin: labPlugin, manifold: labManifold, coupling: labCoupling, finite: labFinite };
  let mounted = [];
  window.FlowLab = {
    mountAll(root) {
      mounted = [];
      root.querySelectorAll("figure.lab[data-lab]").forEach(fig => {
        const f = REG[fig.dataset.lab]; if (!f) return;
        try { mounted.push(f(fig)); } catch (e) { fig.insertAdjacentHTML("beforeend", `<p class="lab-note">实验加载失败：${String(e && e.message || e)}<\/p>`); }
      });
    },
    redrawAll() { mounted.forEach(m => { try { m.redraw(); } catch (e) {} }); },
    _toy: { MODELS, post, flow, V, U, jac }
  };
  const mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
  if (mq && mq.addEventListener) mq.addEventListener("change", () => setTimeout(() => window.FlowLab.redrawAll(), 30));
  new MutationObserver(() => setTimeout(() => window.FlowLab.redrawAll(), 30)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();

</script>
<script>
// 自动生成：python3 scripts/build_flowmap.py。请修改 flowmap/ch/*.html 后重新生成。
window.FLOWMAP_CHAPTERS = {"intro": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 0 讲 · 导论<\/p>\n    <h1>为什么要学<em>流映射<\/em><\/h1>\n    <p class=\"lede\">一步生成就是学会从噪声跳到数据的那一步。这一讲回答三个问题：要学的对象是什么，为什么不能直接回归，以及后面所有论文都在用的三个方程。<\/p>\n    <div class=\"byline\"><span>前置 <b>Flow Matching、CM、MeanFlow<\/b><\/span><span>实验 <b>3 个<\/b><\/span><\/div>\n  <\/div>\n  <aside class=\"aside\">\n    <p><b>怎么读这份讲义<\/b><\/p>\n    <p>每一讲按\"在解决什么问题 → 推导 → 关键设计 → 和前面方法的关系\"展开。灰色右栏是边注：记号、原文出处和补充说明。<\/p>\n    <p>实验都可以拖动，数字是实时算出来的。<\/p>\n  <\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>要学的对象<\/h2>\n      <p>Flow matching 学的是速度场 \\(v(z,t)\\)。采样时从噪声 \\(z_1=\\epsilon\\) 出发，沿常微分方程 \\(\\mathrm dz/\\mathrm dt=v(z,t)\\) 从 \\(t=1\\) 积分到 \\(t=0\\)。每积分一小步就要调用一次网络，所以要几十上百步。<\/p>\n\n      <div class=\"thm def\">\n        <div class=\"thm-label\">定义 1 <i>（流映射与平均速度）<\/i><\/div>\n        <p>对 \\(r\\le t\\)，流映射 \\(X_{t\\to r}\\) 把时间 \\(t\\) 的点沿 ODE 送到时间 \\(r\\)：<\/p>\n        <div class=\"display\">$$X_{t\\to r}(z_t)=z_t-\\int_r^t v(z_\\tau,\\tau)\\,\\mathrm d\\tau. \\tag{1}\\label{eq:fm-def}$$<\/div>\n        <p>把位移除以时间跨度，得到区间上的平均速度：<\/p>\n        <div class=\"display\">$$u(z_t,r,t)\\triangleq\\frac{z_t-X_{t\\to r}(z_t)}{t-r}=\\frac1{t-r}\\int_r^t v(z_\\tau,\\tau)\\,\\mathrm d\\tau. \\tag{2}\\label{eq:avg}$$<\/div>\n      <\/div>\n\n      <p>学会 \\(X_{1\\to0}\\)，一步生成就是 \\(x=X_{1\\to0}(\\epsilon)\\)。学会所有的 \\(X_{t\\to r}\\)，就可以随意选步数：\\(1\\to0.5\\to0\\) 两步，或者更多步。后面每一篇论文，学的都是 \\(X_{t\\to r}\\) 或者等价的 \\(u(z_t,r,t)\\)，区别只在训练信号怎么构造。<\/p>\n\n      <p>为什么不直接用很少几步 Euler 积分代替？因为真实轨迹是弯的。下面的实验里，1 步 Euler 的结果全部落在中间：<\/p>\n\n      <figure class=\"lab\" data-lab=\"euler\">\n        <figcaption>六个高斯团组成的二维数据。蓝线是真实 ODE 轨迹，红色虚线是 Euler 采样的路径。<b>步数越少，越偏离真实终点<\/b>；1 步时所有点都落在数据均值上。<\/figcaption>\n      <\/figure>\n    <\/div>\n    <aside class=\"aside\">\n      <p><b>记号<\/b><\/p>\n      <p>\\(z_t=(1-t)\\,x+t\\,\\epsilon\\)，\\(x\\) 是数据，\\(\\epsilon\\sim\\mathcal N(0,I)\\)。<br>条件速度 \\(v_{\\text{cond}}=\\epsilon-x\\)。<br>边缘速度 \\(v(z,t)=\\mathbb E[\\epsilon-x\\mid z_t=z]\\)。<\/p>\n      <p>不同论文的时间方向不同：Boffi 等、Shortcut、OT-NFM 用 \\(t=0\\) 表示噪声。讲义里统一换成 \\(t=1\\) 为噪声。<\/p>\n      <p>MeanFlow 的 \\(u\\) 就是式 (2)；TVM 的 \\(F_\\theta\\) 也是它。<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>为什么不能直接回归<\/h2>\n      <p>最自然的想法：训练数据里本来就有配对 \\((x,\\epsilon)\\)，那就让网络从 \\(z_t\\) 直接回归到配对的那个 \\(x\\)。可惜这样学到的不是流映射。<\/p>\n\n      <div class=\"derive\">\n        <div class=\"eq\">\\(\\displaystyle \\min_{X_\\theta}\\ \\mathbb E\\,\\big\\|X_\\theta(z_t)-x\\big\\|^2\\)<\/div>\n        <div class=\"why\">用配对的数据点当回归目标<\/div>\n        <div class=\"eq\">\\(\\displaystyle \\Rightarrow\\ X_\\theta^\\ast(z_t)=\\mathbb E\\,[\\,x\\mid z_t\\,]\\)<\/div>\n        <div class=\"why\">平方损失的最优解是<b>条件期望<\/b><\/div>\n        <div class=\"eq\">\\(\\displaystyle \\mathbb E\\,[\\,x\\mid z_1\\,]=\\mathbb E\\,[x]\\)<\/div>\n        <div class=\"why\">\\(t=1\\) 时 \\(z_1=\\epsilon\\) 与 \\(x\\) 独立<\/div>\n      <\/div>\n\n      <p>所以直接回归学到的是\"一堆可能数据的平均\"，是一张模糊的图；在 \\(t=1\\) 处更是所有输出都等于数据均值。下面的实验对比了两者：<\/p>\n\n      <figure class=\"lab\" data-lab=\"collapse\">\n        <figcaption>每个灰色圆圈是一个 \\(z_t\\)。<span class=\"hl-b\">红点<\/span>是直接回归的最优解 \\(\\mathbb E[x\\mid z_t]\\)，<span class=\"hl-a\">蓝点<\/span>是真实流映射的终点。把 t 拖到 1，红点会全部缩到原点。<\/figcaption>\n      <\/figure>\n\n      <p>那为什么学速度时可以直接回归？因为速度目标对 \\(z_t\\) 取条件期望后恰好是我们要的东西：<\/p>\n      <div class=\"display\">$$\\mathbb E\\big[\\,\\epsilon-x\\mid z_t\\,\\big]=v(z_t,t). \\tag{3}\\label{eq:unbiased}$$<\/div>\n      <p>速度是\"局部的\"，条件期望不会改变它的含义；流映射是\"全局的\"，条件期望会把不同轨迹的终点平均掉。Euler Mean Flows 一文还证明了：不存在一种\"条件流映射\"，既和条件速度相容，又能通过取期望得到真实流映射。<\/p>\n    <\/div>\n    <aside class=\"aside\">\n      <p>这就是 OT-NFM 说的\"均值坍缩\"，也是一致性模型早期用 \\(\\ell_2\\) 回归会出模糊图的原因。<\/p>\n      <p>式 (3) 是 flow matching 能成立的全部理由。后面会反复用到：<b>只有速度能从数据里无偏地学<\/b>。<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">3<\/span>流映射满足的三个方程<\/h2>\n      <p>既然不能直接监督 \\(X\\)，就换一个思路：找出真实流映射一定满足的方程，让网络去满足它们。方程里需要的速度，用式 \\eqref{eq:unbiased} 从数据里学。<\/p>\n\n      <div class=\"thm\">\n        <div class=\"thm-label\">命题 1 <i>（流映射的三种刻画）<\/i><\/div>\n        <p>真实流映射满足边界条件 \\(X_{t\\to t}=\\mathrm{id}\\)，并且满足下面任何一个方程。反过来，满足边界条件和其中任意一个方程的映射就是真实流映射。<\/p>\n        <div class=\"display\">$$\\text{(E)}\\quad \\partial_t X_{t\\to r}(z)+\\nabla_z X_{t\\to r}(z)\\,v(z,t)=0 \\tag{4}\\label{eq:euler}$$<\/div>\n        <div class=\"display\">$$\\text{(L)}\\quad \\partial_r X_{t\\to r}(z)=v\\big(X_{t\\to r}(z),\\,r\\big) \\tag{5}\\label{eq:lag}$$<\/div>\n        <div class=\"display\">$$\\text{(S)}\\quad X_{t\\to r}=X_{s\\to r}\\circ X_{t\\to s},\\qquad r\\le s\\le t \\tag{6}\\label{eq:semi}$$<\/div>\n      <\/div>\n\n      <ul class=\"plain\">\n        <li><b>Eulerian（E）<\/b>：让起点沿着轨迹滑动，终点不应该变。实现时要算 \\(\\nabla_z X\\) 与速度的乘积，也就是一次对输入的 JVP，而且<span class=\"hl-b\">切向量里含速度<\/span>。<\/li>\n        <li><b>Lagrangian（L）<\/b>：让终点沿时间移动，它的移动速度等于终点处的速度场。只需要<span class=\"hl-a\">对时间求导<\/span>。<\/li>\n        <li><b>半群（S）<\/b>：一大步等于两小步，不需要任何导数，但要从小步\"自举\"出大步。<\/li>\n      <\/ul>\n\n      <figure class=\"lab\" data-lab=\"equations\">\n        <figcaption>拖动三个时间，看三个方程分别在说什么。把检验对象换成\"一步 Euler 近似\"，三个残差都会明显偏离 0：<b>这就是这些方程能当训练信号的原因<\/b>。<\/figcaption>\n      <\/figure>\n\n      <details>\n        <summary>为什么 (E) 成立：沿轨迹求导<\/summary>\n        <div>\n          <div class=\"derive\">\n            <div class=\"eq\">\\(\\displaystyle X_{t\\to r}(z_t)=x_r\\quad\\text{对轨迹上所有 }t\\text{ 成立}\\)<\/div>\n            <div class=\"why\">同一条轨迹上的点都跳到同一个 \\(x_r\\)<\/div>\n            <div class=\"eq\">\\(\\displaystyle 0=\\frac{\\mathrm d}{\\mathrm dt}X_{t\\to r}(z_t)=\\partial_t X_{t\\to r}+\\nabla_z X_{t\\to r}\\,\\frac{\\mathrm dz_t}{\\mathrm dt}\\)<\/div>\n            <div class=\"why\">链式法则<\/div>\n            <div class=\"eq\">\\(\\displaystyle \\phantom{0}=\\partial_t X_{t\\to r}+\\nabla_z X_{t\\to r}\\,v(z_t,t)\\)<\/div>\n            <div class=\"why\">\\(\\mathrm dz_t/\\mathrm dt=v\\)<\/div>\n          <\/div>\n        <\/div>\n      <\/details>\n    <\/div>\n    <aside class=\"aside\">\n      <p>三个名字来自流体力学：Eulerian 在固定位置观察，Lagrangian 跟着粒子走。<\/p>\n      <p>出处：Boffi、Albergo、Vanden-Eijnden 的 Flow Map Matching（第 1 讲）把三者系统地写了出来。<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">4<\/span>一个通用配方：自蒸馏<\/h2>\n      <p>把上面两点合起来，几乎所有从头训练的 flow map 方法都是同一个配方：<\/p>\n      <ol class=\"plain\">\n        <li>在对角线 \\(r=t\\) 上，用 flow matching 损失从数据学速度（无偏，式 \\eqref{eq:unbiased}）；<\/li>\n        <li>在非对角线 \\(r\\ne t\\) 上，选 (E)、(L)、(S) 中的一个，让网络自己满足它；方程里出现的速度和\"目标侧\"的网络输出都用 stop-gradient 固定住。<\/li>\n      <\/ol>\n      <p>网络既是学生也是老师，所以叫自蒸馏。如果方程里的速度换成一个预训练好的扩散模型，就成了蒸馏（例如 AYF、sCM）。<\/p>\n\n      <div class=\"tablewrap\"><table class=\"cmp\">\n        <thead><tr><th>方程<\/th><th>需要的计算<\/th><th>代表方法<\/th><th>主要麻烦<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td>Eulerian (E)<\/td><td>对输入的 JVP，切向量含速度<\/td><td>MeanFlow、iMF、pMF、SoFlow、AYF-EMD<\/td><td>切向量里的噪声被放大（第 9 讲）<\/td><\/tr>\n          <tr><td>Lagrangian (L)<\/td><td>只对时间求导<\/td><td>TVM、LSD、AYF-LMD<\/td><td>要在模型自己的落脚点上取速度<\/td><\/tr>\n          <tr><td>半群 (S)<\/td><td>无导数，多次前向<\/td><td>Shortcut、PSD、EMF<\/td><td>从小步自举，误差累积<\/td><\/tr>\n        <\/tbody>\n      <\/table><\/div>\n    <\/div>\n    <aside class=\"aside\">\n      <p>\"stop-gradient 的目标\"是这条线所有方法的共同点：目标里含网络自身，不截断梯度会把两边一起拉向平凡解。<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>要学的对象是流映射 \\(X_{t\\to r}\\)，或等价的平均速度 \\(u(z_t,r,t)\\)。<\/span><\/li>\n      <li><span>直接回归会得到条件期望，产生模糊或塌缩；只有速度能从数据里无偏地学。<\/span><\/li>\n      <li><span>流映射满足 Eulerian、Lagrangian、半群三个方程。读后面每一篇论文都可以先问三个问题：用了哪个方程？导数怎么算？目标里的噪声从哪来、怎么处理？<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "fmm": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 1 讲 · 奠基 · 2024<\/p>\n    <h1>Flow Map Matching：<em>把对象定下来<\/em><\/h1>\n    <p class=\"lede\">这篇论文的贡献不在某个数字，而在于把\"少步生成\"统一成学习双时间流映射，并给出三种刻画、两种蒸馏损失和一种直接训练损失。后面的论文几乎都站在它上面。<\/p>\n    <div class=\"byline\"><span>作者 <b>Boffi, Albergo, Vanden-Eijnden<\/b><\/span><span>arXiv <b><a href=\"https://arxiv.org/abs/2406.07507\" target=\"_blank\" rel=\"noopener\">2406.07507<\/a><\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>框架<\/span><span>Lagrangian / Eulerian 蒸馏<\/span><span>直接训练<\/span><span>Wasserstein 控制<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\">\n    <p><b>原文记号<\/b><\/p>\n    <p>随机插值 \\(I_t=\\alpha_t x_0+\\beta_t x_1+\\gamma_t z\\)，\\(t=0\\) 为基分布、\\(t=1\\) 为数据；流映射写作 \\(X_{s,t}\\)，从时间 \\(s\\) 到 \\(t\\)。<\/p>\n    <p>本讲为了和原文对照，保留 \\(X_{s,t}\\) 的写法。<\/p>\n  <\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>在解决什么问题<\/h2>\n      <p>当时的少步方法各有各的对象：一致性模型只学\"跳到终点\"的 \\(X_{t\\to0}\\)，渐进蒸馏学固定步长的跳跃。它们都不能自由选择步数，理论上也缺一个统一的说法。<\/p>\n      <p>作者的主张是：<b>学双时间流映射 \\(X_{s,t}\\)<\/b>，它同时覆盖一步、少步和任意网格上的多步采样；并且它可以用几个简单的方程刻画，这些方程可以直接变成损失函数。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>一致性模型对应 \\(X_{t,1}\\) 这一\"列\"；渐进蒸馏对应固定间隔的 \\(X_{t,t+\\Delta}\\)。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>流映射的刻画<\/h2>\n      <p>设插值 \\(I_t\\) 诱导的速度场为 \\(b_t\\)，流映射满足 \\(X_{s,t}(x_s)=x_t\\)。作者证明它由下面任意一组条件唯一确定（加上 \\(X_{s,s}=\\mathrm{id}\\)）：<\/p>\n      <div class=\"display\">$$\\partial_t X_{s,t}(x)=b_t\\big(X_{s,t}(x)\\big) \\tag{1}\\label{eq:fmm-lag}$$<\/div>\n      <div class=\"display\">$$\\partial_s X_{s,t}(x)+\\nabla X_{s,t}(x)\\,b_s(x)=0 \\tag{2}\\label{eq:fmm-eul}$$<\/div>\n      <div class=\"display\">$$X_{u,t}\\circ X_{s,u}=X_{s,t} \\tag{3}\\label{eq:fmm-semi}$$<\/div>\n      <p>式 \\eqref{eq:fmm-lag} 是 Lagrangian 方程（终点沿速度移动），式 \\eqref{eq:fmm-eul} 是 Eulerian 方程（起点移动、终点不变），式 \\eqref{eq:fmm-semi} 是半群性质。这正是导论里的三个方程，只是时间方向相反。<\/p>\n      <p>参数化取<\/p>\n      <div class=\"display result\">$$X_{s,t}(x)=x+(t-s)\\,v_{s,t}(x), \\tag{4}\\label{eq:fmm-param}$$<\/div>\n      <p>这样 \\(X_{s,s}=\\mathrm{id}\\) 自动成立，而且对角线上 \\(v_{t,t}=b_t\\)：同一个网络在 \\(s=t\\) 时就是速度场。<\/p>\n    <\/div>\n    <aside class=\"aside\">\n      <p>式 (4) 后来被 MeanFlow（\\(u\\)）、TVM（\\(F_\\theta\\)）、AYF 等几乎所有工作沿用，只是换了名字。<\/p>\n      <p>\\(v_{s,t}\\) 就是区间 \\([s,t]\\) 上的平均速度。<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">3<\/span>已知速度场时：两种蒸馏损失<\/h2>\n      <p>如果手上有一个训练好的速度场 \\(b\\)（例如预训练扩散模型），就把式 \\eqref{eq:fmm-lag} 或 \\eqref{eq:fmm-eul} 的残差当损失：<\/p>\n      <div class=\"display\">$$\\mathcal L_{\\text{LMD}}=\\int\\!\\!\\int \\mathbb E\\,\\Big|\\partial_t\\hat X_{s,t}(I_s)-b_t\\big(\\hat X_{s,t}(I_s)\\big)\\Big|^2\\,\\mathrm ds\\,\\mathrm dt \\tag{5}\\label{eq:lmd}$$<\/div>\n      <div class=\"display\">$$\\mathcal L_{\\text{EMD}}=\\int\\!\\!\\int \\mathbb E\\,\\Big|\\partial_s\\hat X_{s,t}(I_s)+\\nabla\\hat X_{s,t}(I_s)\\,b_s(I_s)\\Big|^2\\,\\mathrm ds\\,\\mathrm dt \\tag{6}\\label{eq:emd}$$<\/div>\n      <p>导数都可以用一次 JVP 算。两者的区别后面会反复出现：<span class=\"hl-a\">LMD 只对时间求导<\/span>，<span class=\"hl-b\">EMD 要对输入求导，并把速度放进切向量<\/span>。<\/p>\n\n      <div class=\"thm\">\n        <div class=\"thm-label\">定理 <i>（Wasserstein 控制）<\/i><\/div>\n        <p>以 LMD 为例：设 \\(\\hat\\rho_1\\) 是 \\(\\hat X_{0,1}\\) 推前得到的分布，\\(\\rho_1\\) 是目标分布，则<\/p>\n        <div class=\"display\">$$W_2^2(\\rho_1,\\hat\\rho_1)\\le e^{1+2\\int_0^1|C_t|\\,\\mathrm dt}\\;\\mathcal L_{\\text{LMD}}(\\hat X),$$<\/div>\n        <p>常数 \\(C_t\\) 与速度场的光滑性有关。EMD 有类似的结果。也就是说，把损失压低，生成分布就一定接近目标。<\/p>\n      <\/div>\n    <\/div>\n    <aside class=\"aside\">\n      <p>这里的蒸馏老师是速度场，不是采样器：不需要像渐进蒸馏那样先跑多步 ODE 生成配对。<\/p>\n      <p>TVM 的 \\(W_2\\) 上界（第 6 讲）和这个定理一脉相承，同样需要 Lipschitz 一类的光滑性。<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">4<\/span>没有老师时：直接训练<\/h2>\n      <p>论文还给了一个不需要预训练速度场的损失，叫 Flow Map Matching（FMM）：<\/p>\n      <div class=\"display result\">$$\\mathcal L_{\\text{FMM}}=\\int\\!\\!\\int w_{s,t}\\Big(\\mathbb E\\,\\big|\\class{ta}{\\partial_t\\hat X_{s,t}(\\hat X_{t,s}(I_t))-\\dot I_t}\\big|^2+\\mathbb E\\,\\big|\\class{tb}{\\hat X_{s,t}(\\hat X_{t,s}(I_t))-I_t}\\big|^2\\Big)\\,\\mathrm ds\\,\\mathrm dt. \\tag{7}\\label{eq:fmm}$$<\/div>\n      <p>它同时训练正向和反向的映射。设 \\(y=\\hat X_{t,s}(I_t)\\)，即从 \\(I_t\\) 往回跳到时间 \\(s\\)：<\/p>\n      <ul class=\"plain\">\n        <li><span class=\"hl-b\">第二项<\/span>要求再从 \\(y\\) 跳回 \\(t\\) 时回到原点，即 \\(\\hat X_{s,t}\\) 与 \\(\\hat X_{t,s}\\) 互为逆映射；<\/li>\n        <li><span class=\"hl-a\">第一项<\/span>要求跳回 \\(t\\) 时的终点速度等于插值的时间导数 \\(\\dot I_t\\)。和 flow matching 一样，\\(\\dot I_t\\) 对 \\(I_t\\) 取条件期望正好是 \\(b_t\\)，所以这一项无偏。<\/li>\n      <\/ul>\n      <p>两项合起来，等价于\"终点处的速度对\"，即 Lagrangian 条件，而回归目标只用到了数据。这是\"从头训练流映射\"最早的形式之一；后来的自蒸馏（第 4 讲）把它简化为\"对角线学速度 + 非对角线满足方程\"。<\/p>\n\n      <h3>实验结果<\/h3>\n      <p>论文在二维棋盘格和 CIFAR-10、ImageNet-32 上验证：同样步数下，少步采样明显优于直接用 ODE 求解器；还比较了与一致性模型、渐进蒸馏的关系。实验规模不大，重点在框架。<\/p>\n    <\/div>\n    <aside class=\"aside\">\n      <p>式 (7) 里的复合 \\(\\hat X_{s,t}\\circ\\hat X_{t,s}\\) 是关键：先往回跳，就能把\"在 \\(t\\) 处的数据样本\"变成\"从 \\(s\\) 出发的轨迹的终点\"，于是终点速度可以用数据监督。<\/p>\n      <p>附录说明了流映射与去噪器、一致性模型、渐进蒸馏、神经算子的关系。<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>对象：双时间流映射 \\(X_{s,t}(x)=x+(t-s)v_{s,t}(x)\\)，对角线就是速度场。<\/span><\/li>\n      <li><span>刻画：Lagrangian、Eulerian、半群三个方程；前两者的残差可以直接做蒸馏损失，并控制 \\(W_2\\) 距离。<\/span><\/li>\n      <li><span>直接训练：用\"往回跳再跳回来\"的复合，让终点速度可以用数据无偏监督。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "shortcut": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 2 讲 · 奠基 · ICLR 2025<\/p>\n    <h1>Shortcut Models：<em>两小步等于一大步<\/em><\/h1>\n    <p class=\"lede\">把步长当作网络的输入，用\"两次小跳的平均等于一次大跳\"做自洽训练。只训练一次、只有一个网络、推理时步数随意选。这是半群方程最直接的落地。<\/p>\n    <div class=\"byline\"><span>作者 <b>Frans, Hafner, Levine, Abbeel<\/b><\/span><span>arXiv <b><a href=\"https://arxiv.org/abs/2410.12557\" target=\"_blank\" rel=\"noopener\">2410.12557<\/a><\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>半群 (S)<\/span><span>无导数<\/span><span>从头训练<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\">\n    <p><b>原文记号<\/b><\/p>\n    <p>原文 \\(t=0\\) 为噪声、\\(t=1\\) 为数据，步长 \\(d\\) 朝数据方向。本讲换成统一记号：从 \\(t\\) 走向 \\(t-d\\)。<\/p>\n  <\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>在解决什么问题<\/h2>\n      <p>一致性模型要两阶段训练或精心设计步长课程，渐进蒸馏要多轮蒸馏、每轮都要一个老师。作者想要的是：<b>一个网络、一次训练、不需要老师，推理时 1 步到 128 步随便选。<\/b><\/p>\n    <\/div>\n    <aside class=\"aside\"><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>方法<\/h2>\n      <p>网络 \\(s_\\theta(z_t,t,d)\\) 预测从 \\(z_t\\) 出发、步长为 \\(d\\) 的\"捷径方向\"，一步更新为<\/p>\n      <div class=\"display\">$$z_{t-d}=z_t-d\\cdot s_\\theta(z_t,t,d). \\tag{1}\\label{eq:sc-step}$$<\/div>\n      <p>它就是区间 \\([t-d,t]\\) 上的平均速度。训练目标分两部分：<\/p>\n      <div class=\"derive\">\n        <div class=\"eq\">\\(\\displaystyle d=0:\\quad \\big\\|s_\\theta(z_t,t,0)-(\\epsilon-x)\\big\\|^2\\)<\/div>\n        <div class=\"why\">步长为 0 时就是 <b>flow matching<\/b><\/div>\n        <div class=\"eq\">\\(\\displaystyle z'=z_t-d\\,s_\\theta(z_t,t,d)\\)<\/div>\n        <div class=\"why\">先走一小步<\/div>\n        <div class=\"eq\">\\(\\displaystyle s_{\\text{tgt}}=\\tfrac12\\big[s_\\theta(z_t,t,d)+s_\\theta(z',t-d,d)\\big]\\)<\/div>\n        <div class=\"why\">两次小跳的<b>平均方向<\/b><\/div>\n        <div class=\"eq\">\\(\\displaystyle d>0:\\quad \\big\\|s_\\theta(z_t,t,2d)-\\mathrm{sg}(s_{\\text{tgt}})\\big\\|^2\\)<\/div>\n        <div class=\"why\">一次大跳要等于两次小跳<\/div>\n      <\/div>\n      <p>第三行乘上 \\(2d\\) 再看就是半群关系：\\(z_t-2d\\,s(z_t,t,2d)=z'-d\\,s(z',t-d,d)\\)，即 \\(X_{t\\to t-2d}=X_{t-d\\to t-2d}\\circ X_{t\\to t-d}\\)。<\/p>\n      <p>实现细节：步长取 2 的幂（如 \\(1/128\\) 到 \\(1/2\\)）；一个批次里约 3/4 的样本做 flow matching，1/4 做自洽。<\/p>\n\n      <figure class=\"lab\" data-lab=\"equations\" data-preset=\"semi\">\n        <figcaption>选\"半群\"模式：<span class=\"hl-b\">红色<\/span>是先跳到 s 再跳到 r，<span class=\"hl-a\">蓝色<\/span>是一步直接跳。对真实流映射两者重合；Shortcut 训练的就是让网络满足这一点。<\/figcaption>\n      <\/figure>\n    <\/div>\n    <aside class=\"aside\">\n      <p>为什么取平均而不是复合？因为网络输出的是方向，两段平均方向的平均，乘上总步长就等于两段位移之和。<\/p>\n      <p>\"3/4 做 flow matching\"保证对角线上的速度是对的，否则自洽目标没有可靠的起点。<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">3<\/span>它的局限，以及为什么后来被超过<\/h2>\n      <p>半群监督是\"自举\"的：大步长的目标由两个小步长的输出拼成，小步长的误差会一层层传到大步长。Boffi 等（第 4 讲）明确指出，这类 progressive 方法很难给出误差保证，实验上也不如 Lagrangian 型方法。离散的步长集合也让模型只在少数几个 \\(d\\) 上被训练过。<\/p>\n      <p>MeanFlow 可以看成它的连续版本：把\"两小步等于一大步\"在 \\(d\\to0\\) 时求极限，得到一个微分恒等式，不再需要离散步长，也不再逐层自举。<\/p>\n\n      <h3>实验结果<\/h3>\n      <p>在 CelebA-HQ 和 ImageNet-256 上，同样单阶段训练的条件下，各个步数的质量都优于一致性模型和 reflow 基线；但一步生成与多步扩散仍有明显差距。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>ESC（第 10 讲）把 Shortcut、CT、MeanFlow、IMM 放进同一个\"一步预测 vs 两步目标\"的框架里对比。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>把步长 \\(d\\) 作为输入，\\(d=0\\) 用 flow matching，\\(d>0\\) 用\"两小步平均等于一大步\"。<\/span><\/li>\n      <li><span>本质是半群方程，无导数、实现简单。<\/span><\/li>\n      <li><span>代价是从小步自举到大步，误差累积，缺少理论保证。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "meanflow": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 3 讲 · 奠基 · NeurIPS 2025<\/p>\n    <h1>MeanFlow：<em>平均速度恒等式<\/em><\/h1>\n    <p class=\"lede\">从平均速度的定义推出一个它必须满足的微分恒等式，把恒等式右边当回归目标，就能从头训练一步生成模型。这一讲把推导、JVP 切向量和训练细节完整走一遍。<\/p>\n    <div class=\"byline\"><span>作者 <b>Geng, Deng, Bai, Kolter, He<\/b><\/span><span>arXiv <b><a href=\"https://arxiv.org/abs/2505.13447\" target=\"_blank\" rel=\"noopener\">2505.13447<\/a><\/b><\/span><span>ImageNet 256 <b>1-NFE FID 3.43<\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>Eulerian (E)<\/span><span>JVP<\/span><span>从头训练<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\"><p>MeanFlow 的记号和讲义统一记号一致：\\(z_t=(1-t)x+t\\epsilon\\)，\\(z_r=z_t-(t-r)\\,u(z_t,r,t)\\)。<\/p><\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>推导恒等式<\/h2>\n      <p>从平均速度的定义出发（导论式 (2)），把分母乘过去：<\/p>\n      <div class=\"derive\">\n        <div class=\"eq\">\\(\\displaystyle (t-r)\\,u(z_t,r,t)=\\int_r^t v(z_\\tau,\\tau)\\,\\mathrm d\\tau\\)<\/div>\n        <div class=\"why\">平均速度的定义<\/div>\n        <div class=\"eq\">\\(\\displaystyle u+(t-r)\\,\\frac{\\mathrm d}{\\mathrm dt}u(z_t,r,t)=v(z_t,t)\\)<\/div>\n        <div class=\"why\">固定 \\(r\\)，两边对 \\(t\\) 求<b>全导数<\/b>：左边用乘积法则，右边用微积分基本定理<\/div>\n        <div class=\"eq\">\\(\\displaystyle u(z_t,r,t)=\\class{ta}{v(z_t,t)}-\\class{tb}{(t-r)\\,\\frac{\\mathrm d}{\\mathrm dt}u(z_t,r,t)}\\)<\/div>\n        <div class=\"why\">移项<\/div>\n      <\/div>\n      <div class=\"display result\">$$u(z_t,r,t)=\\class{ta}{v(z_t,t)}-\\class{tb}{(t-r)\\big(v\\,\\partial_z u+\\partial_t u\\big)}. \\tag{1}\\label{eq:mf-id}$$<\/div>\n      <p>右边第一项是<span class=\"hl-a\">瞬时速度<\/span>，可以用条件速度 \\(\\epsilon-x\\) 无偏地代替；第二项是<span class=\"hl-b\">修正项<\/span>，告诉网络平均速度与瞬时速度差多少。全导数沿轨迹求：\\(z_t\\) 本身随 \\(t\\) 移动，速度为 \\(v\\)，所以展开后有 \\(v\\,\\partial_z u\\) 一项。<\/p>\n\n      <figure class=\"lab\" data-lab=\"identity\">\n        <figcaption>在二维例子里，用真实流映射算出 \\(u\\) 和恒等式右边，两者应当相等。把 r 拖向 t，<span class=\"hl-a\">平均速度<\/span>会趋于<span class=\"hl-b\">瞬时速度<\/span>。<\/figcaption>\n      <\/figure>\n    <\/div>\n    <aside class=\"aside\">\n      <p>和导论式 (4) 对照：把 \\(X_{t\\to r}=z-(t-r)u\\) 代入 Eulerian 方程 \\(\\partial_tX+\\nabla_zX\\,v=0\\)，整理后就是式 (1)。所以 MeanFlow 是 <b>Eulerian 型<\/b>。<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>变成训练目标<\/h2>\n      <p>把式 \\eqref{eq:mf-id} 的右边当成回归目标，网络放在左边：<\/p>\n      <div class=\"display\">$$\\mathcal L=\\mathbb E\\,\\big\\|u_\\theta(z_t,r,t)-\\mathrm{sg}(u_{\\text{tgt}})\\big\\|^2,\\qquad u_{\\text{tgt}}=v_t-(t-r)\\big(v_t\\,\\partial_z u_\\theta+\\partial_t u_\\theta\\big). \\tag{2}\\label{eq:mf-loss}$$<\/div>\n      <p>其中 \\(v_t=\\epsilon-x\\)。几个关键点：<\/p>\n      <ul class=\"plain\">\n        <li><b>JVP 切向量为 \\((v_t,0,1)\\)<\/b>。全导数 \\(\\frac{\\mathrm du}{\\mathrm dt}=\\partial_z u\\cdot\\frac{\\mathrm dz}{\\mathrm dt}+\\partial_r u\\cdot\\frac{\\mathrm dr}{\\mathrm dt}+\\partial_t u\\)，沿轨迹 \\(\\mathrm dz/\\mathrm dt=v\\)，\\(r\\) 固定，所以一次前向模式自动微分就能同时得到 \\(u_\\theta\\) 和 \\(\\mathrm du_\\theta/\\mathrm dt\\)。<\/li>\n        <li><b>stop-gradient<\/b>：目标里含网络自身，不截断就要二阶导，而且容易把两边一起拉向平凡解。<\/li>\n        <li><b>\\(r=t\\) 时<\/b>修正项为 0，目标退化为 \\(v_t\\)，即 flow matching。训练中保留一部分 \\(r=t\\) 的样本（论文消融里约 75% 的样本 \\(r=t\\)），给恒等式一个可靠的锚。<\/li>\n        <li><b>自适应权重<\/b>：\\(w=1/(\\|\\Delta\\|^2+c)^p\\)，相当于对大误差样本降权的鲁棒损失。<\/li>\n      <\/ul>\n\n      <h3>把 CFG 烤进模型<\/h3>\n      <p>一步模型没法在采样时做 CFG 外推，于是在训练时把目标速度换成引导后的速度：<\/p>\n      <div class=\"display\">$$\\tilde v_t=\\omega\\,v_t+(1-\\omega)\\,u_\\theta(z_t,t,t\\mid\\varnothing),$$<\/div>\n      <p>其中无条件速度用网络自己的对角线输出估计。这样采样仍是 1 NFE，代价是 \\(\\omega\\) 在训练时就固定了。论文附录还加了一个系数 \\(\\kappa\\)，把条件版本的 \\(u_\\theta\\) 也混进目标（等效引导强度 \\(\\omega'=\\omega/(1-\\kappa)\\)），并且只在一段 \\(t\\) 区间内启用引导；默认超参是 \\(r\\ne t\\) 比例 25%、自适应权重 \\(p=1\\)。<\/p>\n\n      <pre class=\"algo\">x ~ 数据, ε ~ N(0, I);  (t, r) ~ logit-normal，一部分令 r = t\nz = (1 − t)·x + t·ε,   v = ε − x\n(u, dudt) = jvp(u_θ, (z, r, t), (v, 0, 1))\nu_tgt = v − (t − r)·dudt\nloss  = 自适应权重( ‖u − stopgrad(u_tgt)‖² )\n采样:  x = ε − u_θ(ε, 0, 1)<\/pre>\n    <\/div>\n    <aside class=\"aside\">\n      <p>注意切向量里的 \\(v\\) 只能用带噪声的条件速度 \\(\\epsilon-x\\) 代替。这个看似无害的替换，正是第 7、9、10、11 讲要处理的问题。<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">3<\/span>结果与局限<\/h2>\n      <div class=\"tablewrap\"><table class=\"cmp\">\n        <thead><tr><th>模型<\/th><th>NFE<\/th><th>FID（ImageNet 256）<\/th><\/tr><\/thead>\n        <tbody><tr><td>MF-B/2<\/td><td>1<\/td><td>6.17<\/td><\/tr><tr><td>MF-XL/2<\/td><td>1<\/td><td>3.43<\/td><\/tr><tr><td>MF-XL/2<\/td><td>2<\/td><td>2.20<\/td><\/tr><\/tbody>\n      <\/table><\/div>\n      <p>从头训练，不需要老师、课程或预训练。局限也很清楚，后面几讲分别处理：<\/p>\n      <ul class=\"plain\">\n        <li>JVP 计算贵、实现难（第 12、13 讲去掉 JVP）；<\/li>\n        <li>目标里含网络自身，不是标准回归（第 7 讲 iMF）；<\/li>\n        <li>切向量用带噪的条件速度，目标方差大、损失不降（第 9、10、11 讲）；<\/li>\n        <li>CFG 强度训练时写死（第 7 讲）；只能在潜空间做（第 8 讲 pMF）。<\/li>\n      <\/ul>\n    <\/div>\n    <aside class=\"aside\"><p>MeanFlow 的一步结果 3.43 在一年后被 iMF（1.72）、Drifting（1.54）等超过，但它确立了\"从头训练一步模型\"这条路线。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>恒等式：\\(u=v-(t-r)\\frac{\\mathrm du}{\\mathrm dt}\\)，由平均速度的定义对 \\(t\\) 求全导数得到。<\/span><\/li>\n      <li><span>全导数沿轨迹求，JVP 切向量为 \\((v,0,1)\\)；它是 Eulerian 方程的平均速度形式。<\/span><\/li>\n      <li><span>\\(r=t\\) 退化为 flow matching；CFG 通过修改目标速度烤进模型。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "selfdistill": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 4 讲 · 奠基 · 2025<\/p>\n    <h1>自蒸馏框架：<em>三类方程的统一与比较<\/em><\/h1>\n    <p class=\"lede\">\"How to build a consistency model\" 把从头训练流映射写成一个通用配方：对角线学速度，非对角线满足三个方程之一。它统一了 CM、Shortcut、MeanFlow，并且在相同条件下比较了三类方法，结论是 Lagrangian 型最好。<\/p>\n    <div class=\"byline\"><span>作者 <b>Boffi, Albergo, Vanden-Eijnden<\/b><\/span><span>arXiv <b><a href=\"https://arxiv.org/abs/2505.18825\" target=\"_blank\" rel=\"noopener\">2505.18825<\/a><\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>框架<\/span><span>LSD / ESD / PSD<\/span><span>从头训练<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\"><p><b>原文记号<\/b><\/p><p>同第 1 讲：\\(t=0\\) 为基分布、\\(t=1\\) 为数据，\\(X_{s,t}(x)=x+(t-s)v_{s,t}(x)\\)，\\(0\\le s\\le t\\le1\\)。<\/p><\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>配方<\/h2>\n      <p>关键观察：\\(\\lim_{s\\to t}v_{s,t}=b_t\\)，所以对角线 \\(v_{t,t}\\) 就是速度场，可以用 flow matching 直接从数据学：<\/p>\n      <div class=\"display\">$$\\mathcal L_b(\\hat v)=\\int_0^1\\mathbb E_{x_0,x_1}\\big|\\hat v_{t,t}(I_t)-\\dot I_t\\big|^2\\,\\mathrm dt. \\tag{1}\\label{eq:sd-b}$$<\/div>\n      <p>非对角线再加上三个刻画之一的残差。方程里需要的速度，用网络自己的对角线 \\(\\hat v_{t,t}\\) 代替：<b>老师就是学生自己<\/b>。<\/p>\n      <div class=\"display\">$$\\mathcal L_{\\text{SD}}=\\mathcal L_b+\\mathcal L_{\\text D},\\qquad \\mathcal L_{\\text D}\\in\\{\\mathcal L_{\\text{LSD}},\\ \\mathcal L_{\\text{ESD}},\\ \\mathcal L_{\\text{PSD}}\\}. \\tag{2}$$<\/div>\n    <\/div>\n    <aside class=\"aside\"><p>\"自蒸馏\"这个词就来自这里：蒸馏损失和第 1 讲相同，只是老师换成了网络自己的对角线。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>三个自蒸馏目标<\/h2>\n      <div class=\"display\">$$\\mathcal L_{\\text{LSD}}=\\iint\\mathbb E\\,\\Big|\\partial_t\\hat X_{s,t}(I_s)-\\hat v_{t,t}\\big(\\hat X_{s,t}(I_s)\\big)\\Big|^2 \\tag{3}\\label{eq:lsd}$$<\/div>\n      <div class=\"display\">$$\\mathcal L_{\\text{ESD}}=\\iint\\mathbb E\\,\\Big|\\partial_s\\hat X_{s,t}(I_s)+\\nabla\\hat X_{s,t}(I_s)\\,\\hat v_{s,s}(I_s)\\Big|^2 \\tag{4}\\label{eq:esd}$$<\/div>\n      <div class=\"display\">$$\\mathcal L_{\\text{PSD}}=\\iiint\\mathbb E\\,\\Big|\\hat X_{s,t}(I_s)-\\hat X_{u,t}\\big(\\hat X_{s,u}(I_s)\\big)\\Big|^2 \\tag{5}\\label{eq:psd}$$<\/div>\n      <p>三者需要的计算不同，这决定了它们的稳定性：<\/p>\n      <div class=\"tablewrap\"><table class=\"cmp\">\n        <thead><tr><th>目标<\/th><th>空间导数<\/th><th>时间导数<\/th><th>从小步自举<\/th><th>理论保证<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td>LSD（Lagrangian）<\/td><td>无<\/td><td>1 个<\/td><td>否<\/td><td>有<\/td><\/tr>\n          <tr><td>ESD（Eulerian）<\/td><td>有（\\(\\nabla\\hat X\\)）<\/td><td>1 个<\/td><td>否<\/td><td>有<\/td><\/tr>\n          <tr><td>PSD（Progressive）<\/td><td>无<\/td><td>无<\/td><td>是<\/td><td>作者没能证明<\/td><\/tr>\n        <\/tbody>\n      <\/table><\/div>\n      <p>作者在附录里说明了，PSD 的保证之所以难以得到，是因为\"从小步自举到大步\"带来误差累积和分布偏移，他们认为这是这类算法构造上的根本困难。<\/p>\n\n      <figure class=\"lab\" data-lab=\"equations\" data-preset=\"lag\">\n        <figcaption>三种模式分别对应 LSD、ESD、PSD 所约束的关系。实际训练中，方程里的速度和终点都是网络自己的估计。<\/figcaption>\n      <\/figure>\n    <\/div>\n    <aside class=\"aside\">\n      <p>\"空间导数\"指 \\(\\nabla_x\\hat X\\)。它需要沿一个 \\(d\\) 维方向做 JVP，而且方向里带着速度的估计；时间导数只是沿一个标量方向。<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">3<\/span>统一已有方法<\/h2>\n      <ul class=\"plain\">\n        <li><b>一致性模型（CT/sCM）<\/b>：只学 \\(X_{s,1}\\) 这一列，属于 Eulerian 型（起点沿轨迹动、终点不变）。<\/li>\n        <li><b>MeanFlow<\/b>：恒等式里含 \\(v\\,\\partial_z u\\)，是 ESD 的平均速度形式。<\/li>\n        <li><b>Shortcut<\/b>：两小步等于一大步，是 PSD。<\/li>\n        <li><b>TVM<\/b>（第 6 讲）：在终点处匹配速度，思想上最接近 LSD。<\/li>\n      <\/ul>\n\n      <h3>实验<\/h3>\n      <p>在棋盘格、CIFAR-10、CelebA-64、AFHQ-64 上，按目标中空间导数与时间导数的个数分析各方法。结论：<b>LSD 在所有基准上最好<\/b>，因为它既不需要空间导数，也不依赖小步自举。例如 CelebA-64 上，LSD 的 FID 从 1 步的 12.22 降到 16 步的 1.96；PSD 与 LSD 的差距在 CelebA-64 低步数时最明显。<\/p>\n      <p>论文还讨论了时间采样、损失权重、PSD 的采样与缩放方式，以及条件生成和引导的接入。<\/p>\n    <\/div>\n    <aside class=\"aside\">\n      <p>同期的 AYF（第 5 讲）在蒸馏设定下得到了不完全相同的结论：Lagrangian 在二维更稳，但在图像上会过度平滑。两者结合起来看更全面。<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>配方：对角线用 flow matching 学速度，非对角线满足一个方程，速度用网络自己的对角线代替。<\/span><\/li>\n      <li><span>三类目标的差别在于：要不要空间导数、要不要从小步自举。<\/span><\/li>\n      <li><span>实验结论：避开这两者的 LSD 最稳最好。这给\"为什么 TVM 有效\"提供了框架层面的解释。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "ayf": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 5 讲 · 奠基 · NeurIPS 2025<\/p>\n    <h1>Align Your Flow：<em>可扩展的流映射蒸馏<\/em><\/h1>\n    <p class=\"lede\">先证明一致性模型在多步采样时必然退化，再给出两个连续时间的流映射蒸馏目标（Eulerian 与 Lagrangian），加上 autoguidance 和短暂的对抗微调，在 ImageNet 和 FLUX.1 上蒸馏出少步与多步都好用的模型。<\/p>\n    <div class=\"byline\"><span>作者 <b>Sabour, Fidler, Kreis<\/b>（NVIDIA）<\/span><span>arXiv <b><a href=\"https://arxiv.org/abs/2506.14603\" target=\"_blank\" rel=\"noopener\">2506.14603<\/a><\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>蒸馏<\/span><span>Eulerian / Lagrangian<\/span><span>Autoguidance<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\"><p>和第 4 讲的区别：这里方程里的速度来自<b>预训练老师<\/b> \\(v_\\phi\\)，而不是网络自己。<\/p><\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>一致性模型为什么不适合多步<\/h2>\n      <p>CM 的多步采样是\"一步去噪到 \\(x_0\\)，再加噪到较小的时间，再去噪\"。实践中步数一多，质量反而下降，大多数论文只报 1 到 2 步。<\/p>\n      <div class=\"thm\">\n        <div class=\"thm-label\">定理 <i>（CM 多步采样必然退化）<\/i><\/div>\n        <p>数据为 \\(\\mathcal N(0,c^2I)\\)。对任意 \\(\\delta>0\\)，存在一个与最优 CM 的误差处处小于 \\(\\delta\\) 的次优 CM，以及某个步数 \\(N\\)，使得步数超过 \\(N\\) 之后，生成分布与真实分布的 \\(W_2\\) 距离反而增大。<\/p>\n      <\/div>\n      <p>原因是每次\"跳到终点再加噪\"都把误差注入下一步，而 CM 的设计里没有任何东西能纠正它。\\(c=0.5\\)（常见的数据标准差）时，最优步数恰好是 2 步，与文献中的经验一致。流映射直接从 \\(t\\) 跳到 \\(s\\)，不经过终点，所以没有这个问题。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>这条定理解释了为什么\"少步\"方法应该学 \\(X_{t\\to s}\\) 而不是只学 \\(X_{t\\to0}\\)。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>两个连续时间蒸馏目标<\/h2>\n      <p>参数化 \\(f_\\theta(x_t,t,s)=x_t+(s-t)F_\\theta(x_t,t,s)\\)，老师给出 PF-ODE \\(\\mathrm dx_t/\\mathrm dt=v_\\phi(x_t,t)\\)。<\/p>\n\n      <h3>AYF-EMD（Eulerian）<\/h3>\n      <p>固定终点 \\(s\\)，让起点沿老师的 ODE 移动一小步 \\(t'=t+\\epsilon(s-t)\\)（用一步 Euler 得到 \\(x_{t'}\\)），要求输出不变：<\/p>\n      <div class=\"display\">$$\\mathbb E\\big[w(t,s)\\,\\|f_\\theta(x_t,t,s)-f_{\\theta^-}(x_{t'},t',s)\\|^2\\big]. \\tag{1}$$<\/div>\n      <p>\\(\\epsilon\\to0\\) 时梯度收敛到<\/p>\n      <div class=\"display\">$$\\nabla_\\theta\\,\\mathbb E\\Big[w'(t,s)\\,\\mathrm{sign}(t-s)\\,f_\\theta^\\top\\,\\frac{\\mathrm d f_{\\theta^-}(x_t,t,s)}{\\mathrm dt}\\Big]. \\tag{2}\\label{eq:ayf-emd}$$<\/div>\n      <p>\\(s=0\\) 时就是连续时间一致性模型（sCM）的目标；\\(s\\to t\\) 时退化为 flow matching。<\/p>\n\n      <h3>AYF-LMD（Lagrangian）<\/h3>\n      <p>固定起点，让终点从 \\(s'=s+\\epsilon(t-s)\\) 沿老师的 ODE 走一小步到 \\(s\\)：<\/p>\n      <div class=\"display\">$$\\mathbb E\\big[w(t,s)\\,\\|f_\\theta(x_t,t,s)-\\mathrm{ODE}_{s'\\to s}[f_{\\theta^-}(x_t,t,s')]\\|^2\\big], \\tag{3}$$<\/div>\n      <div class=\"display\">$$\\nabla_\\theta\\,\\mathbb E\\Big[w'(t,s)\\,\\mathrm{sign}(s-t)\\,f_\\theta^\\top\\Big(\\frac{\\mathrm d f_{\\theta^-}}{\\mathrm ds}-v_\\phi\\big(f_{\\theta^-}(x_t,t,s),s\\big)\\Big)\\Big]. \\tag{4}\\label{eq:ayf-lmd}$$<\/div>\n      <p>括号里正是 Lagrangian 方程的残差。<\/p>\n\n      <p><b>一个值得注意的发现<\/b>：二维玩具实验里 LMD 更稳定，但在图像上会生成过度平滑的样本，质量明显下降，所以图像实验用的是 EMD。这与第 4 讲\"LSD 最好\"的结论并不矛盾：一个是自蒸馏、一个是蒸馏，设定不同；它提醒我们，方程的选择没有放之四海皆准的答案。<\/p>\n    <\/div>\n    <aside class=\"aside\">\n      <p>\\(w'(t,s)=w(t,s)\\,|t-s|\\)。<\/p>\n      <p>梯度形式 \\(f^\\top\\,\\mathrm df^-/\\mathrm dt\\) 和 sCM 的写法一样，实际实现时写成一个代理损失，使其梯度等于这个极限。<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">3<\/span>让结果更锐利：autoguidance 与对抗微调<\/h2>\n      <p>扩散模型通常靠 CFG 提升质量，但 CFG 会降低多样性、导致过饱和。AYF 在蒸馏时改用 <b>autoguidance<\/b>：用一个更弱的模型来引导老师，作为蒸馏目标。最后再做一段<b>短暂的对抗微调<\/b>，进一步提升锐度，同时尽量保住多样性。<\/p>\n      <h3>结果<\/h3>\n      <ul class=\"plain\">\n        <li>ImageNet 64×64 与 512×512 上，在少步生成中取得当时同类最好的结果，而且网络小、效率高：4 步采样的速度和其它工作的 1 步相当甚至更快。<\/li>\n        <li>对抗微调后的多样性明显高于其它对抗训练方法。<\/li>\n        <li>用 LoRA 蒸馏 FLUX.1，得到的文生图流映射模型优于所有非对抗训练的少步采样器。<\/li>\n      <\/ul>\n    <\/div>\n    <aside class=\"aside\"><p>和 TVM、MeanFlow 不同，AYF 需要一个强老师；它的优势在于规模化和多步质量不退化。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>理论：CM 的多步采样会累积误差，流映射没有这个问题。<\/span><\/li>\n      <li><span>两个蒸馏目标：EMD 推广了 sCM 与 flow matching，LMD 对应 Lagrangian 残差；图像上 EMD 更好。<\/span><\/li>\n      <li><span>autoguidance + 短暂对抗微调，规模化到 FLUX.1。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "tvm": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 6 讲 · 奠基 · ICLR 2026<\/p>\n    <h1>Terminal Velocity Matching：<em>在终点匹配速度<\/em><\/h1>\n    <p class=\"lede\">学的对象和 MeanFlow 完全一样，区别是对终点时间求导而不是对起点。这个看似很小的换法，让条件速度不再进入 JVP，并且得到了 \\(W_2\\) 上界；代价是需要让网络接近 Lipschitz。<\/p>\n    <div class=\"byline\"><span>作者 <b>Zhou, Parger, Haque, Song<\/b>（Luma AI）<\/span><span>arXiv <b><a href=\"https://arxiv.org/abs/2511.19797\" target=\"_blank\" rel=\"noopener\">2511.19797<\/a><\/b><\/span><span>ImageNet 256 <b>1-NFE 3.29 · 4-NFE 1.99<\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>Lagrangian (L)<\/span><span>时间 JVP<\/span><span>从头训练<\/span><span>W₂ 上界<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\"><p><b>原文记号<\/b><\/p><p>\\(x_t=(1-t)x_0+tx_1\\)，\\(x_0\\) 是数据；从 \\(t\\) 走到 \\(s\\le t\\)。位移 \\(f(x_t,t,s)=\\psi(x_t,t,s)-x_t\\)。<\/p><\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>对象：和 MeanFlow 是同一个东西<\/h2>\n      <p>参数化位移 \\(f_\\theta(x_t,t,s)=(s-t)\\,F_\\theta(x_t,t,s)\\)。因为 \\(\\psi=x_t+(s-t)F\\)，对照 MeanFlow 的 \\(z_r=z_t-(t-r)u\\)，可知 \\(F_\\theta\\) 就是平均速度 \\(u\\)。乘上 \\((s-t)\\) 让 \\(s=t\\) 时位移自动为 0。<\/p>\n      <p>真实位移满足两个条件：<\/p>\n      <div class=\"display\">$$\\text{①}\\quad f(x_t,t,s)=\\int_t^s u(x_r,r)\\,\\mathrm dr,\\qquad \\text{②}\\quad \\frac{\\mathrm d}{\\mathrm ds}f(x_t,t,s)\\Big|_{s=t}=u(x_t,t). \\tag{1}$$<\/div>\n      <p>由 ② 得 \\(u_\\theta(x_t,t)=F_\\theta(x_t,t,t)\\)：同一个网络取 \\(s=t\\) 就是速度场，可以用 flow matching 学。困难在 ①：直接监督要在训练时积分 ODE。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>TVM 原文用 \\(u\\) 表示瞬时速度场，用 \\(v_s\\) 表示条件速度，和 MeanFlow 的用法相反，阅读时注意。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>核心技巧：对终点时间求导<\/h2>\n      <p>对积分上限 \\(s\\) 求导，把积分方程变成微分方程：<\/p>\n      <div class=\"display result\">$$\\frac{\\mathrm d}{\\mathrm ds}f(x_t,t,s)=u\\big(\\psi(x_t,t,s),\\,s\\big). \\tag{2}\\label{eq:tv}$$<\/div>\n      <p>这就是<b>终点速度条件<\/b>：跳到 \\(s\\) 的位移对 \\(s\\) 的变化率，等于落脚点处的真实速度。为什么只满足这个导数条件就够了？<\/p>\n      <div class=\"derive\">\n        <div class=\"eq\">\\(\\displaystyle f_\\theta(x_t,t,0)-f(x_t,t,0)=-\\int_0^t\\Big(\\tfrac{\\mathrm d}{\\mathrm ds}f_\\theta-\\tfrac{\\mathrm d}{\\mathrm ds}f\\Big)\\mathrm ds\\)<\/div>\n        <div class=\"why\">两者在 \\(s=t\\) 处都为 0，写成导数的积分<\/div>\n        <div class=\"eq\">\\(\\displaystyle \\Big\\|\\int_0^t(a-b)\\,\\mathrm ds\\Big\\|^2\\le t\\int_0^t\\|a-b\\|^2\\,\\mathrm ds\\le\\int_0^t\\|a-b\\|^2\\,\\mathrm ds\\)<\/div>\n        <div class=\"why\">Cauchy–Schwarz，再用 \\(t\\le1\\)<\/div>\n      <\/div>\n      <div class=\"display\">$$\\underbrace{\\mathbb E\\,\\|f_\\theta(x_t,t,0)-f(x_t,t,0)\\|^2}_{\\text{一步位移误差}}\\le\\int_0^t\\mathbb E\\,\\Big\\|\\tfrac{\\mathrm d}{\\mathrm ds}f_\\theta(x_t,t,s)-u(\\psi(x_t,t,s),s)\\Big\\|^2\\mathrm ds. \\tag{3}\\label{eq:bound}$$<\/div>\n      <p>只要每个中间时刻的终点速度对，一步跳的结果就对。\\(t\\to s\\) 时，终点速度误差退化为 flow matching 损失：<b>flow matching 就是\"位移为 0 时的终点速度匹配\"<\/b>。<\/p>\n\n      <figure class=\"lab\" data-lab=\"equations\" data-preset=\"lag\">\n        <figcaption>\"Lagrangian\"模式：拖动终点时间 r，<span class=\"hl-b\">红色箭头<\/span>是终点处的速度场，终点的移动方向应当与它一致。换成\"一步 Euler 近似\"，残差明显变大。<\/figcaption>\n      <\/figure>\n    <\/div>\n    <aside class=\"aside\"><p>比喻：路程长度没法直接量（积分），但只要行程中每一刻的速度都等于路面要求的速度，最终位移自然是对的。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">3<\/span>未知量用网络自己代替<\/h2>\n      <p>式 \\eqref{eq:tv} 中真实落脚点 \\(\\psi\\) 和真实速度 \\(u\\) 都未知，用模型自己的落脚点和速度分支代替：<\/p>\n      <div class=\"display\">$$u\\big(\\psi(x_t,t,s),s\\big)\\approx u_{\\theta^-}\\big(x_t+f_\\theta(x_t,t,s),\\,s\\big). \\tag{4}$$<\/div>\n      <p>完整损失：<\/p>\n      <div class=\"display result\">$$\\mathcal L^{t,s}_{\\text{TVM}}=\\Big\\|\\class{ta}{\\tfrac{\\mathrm d}{\\mathrm ds}f_\\theta(x_t,t,s)-u_{\\theta^-}\\big(x_t+f_\\theta,s\\big)}\\Big\\|^2+\\big\\|\\class{tb}{u_\\theta(x_s,s)-v_s}\\big\\|^2. \\tag{5}\\label{eq:tvm}$$<\/div>\n      <p><span class=\"hl-b\">FM 项<\/span>从数据学速度场（条件速度 \\(v_s\\) 是无偏目标）；<span class=\"hl-a\">终点速度项<\/span>再用这个速度场去监督长距离跳跃。两项共用一个网络，属于 Lagrangian 型自蒸馏。<\/p>\n\n      <h3>和 MeanFlow 的对偶<\/h3>\n      <p>论文第 5 节把 MeanFlow 写成同样的形式：它要求 \\(\\frac{\\mathrm d}{\\mathrm dt}f_\\theta=-u(x_t,t)\\)，即对<b>起点<\/b>求导；起点随 \\(t\\) 移动，全导数里有 \\(u(x_t,t)\\cdot\\nabla_x F\\)，速度要进入 JVP 切向量，实际只能用带噪的 \\(v_t\\)。TVM 对<b>终点<\/b>求导：<\/p>\n      <div class=\"display\">$$\\frac{\\mathrm d}{\\mathrm ds}f_\\theta=F_\\theta+(s-t)\\,\\partial_sF_\\theta,$$<\/div>\n      <p>JVP 只沿 \\(s\\) 这一个标量方向，切向量里不含速度。<b>条件速度只出现在 FM 项里，作为加性的无偏目标，不会被 Jacobian 放大。<\/b>代价是代理目标在模型自己（可能不准）的落脚点上取速度，引入的是偏差而不是方差。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>第 9 讲会看到 MeanFlow 的切向量噪声有多严重；TVM 从构造上就绕开了它。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">4<\/span>理论与架构：为什么需要 Lipschitz<\/h2>\n      <div class=\"thm\">\n        <div class=\"thm-label\">定理 1 <i>（\\(W_2\\) 上界）<\/i><\/div>\n        <p>设速度网络 \\(u_\\theta(\\cdot,s)\\) 关于位置 Lipschitz 连续，常数为 \\(L(s)\\)，并满足温和的正则条件，则<\/p>\n        <div class=\"display\">$$W_2^2\\big(f^\\theta_{t\\to0}\\#p_t,\\;p_0\\big)\\le\\int_0^t\\lambda[L](s)\\,\\mathcal L^{t,s}_{\\text{TVM}}\\,\\mathrm ds+C.$$<\/div>\n      <\/div>\n      <p>代理目标是在\"模型以为的落脚点\"上取速度。如果速度场对位置极其敏感，落脚点差一点，速度就差很多，误差一路放大；Lipschitz 常数限制的正是这种放大。<\/p>\n      <p>标准 DiT 不满足：LayerNorm 和点积注意力都不是 Lipschitz 的，训练中激活会突然爆炸。最小改动：RMSNorm 作 QK-Norm；所有 LayerNorm 换成无参数 RMSNorm；AdaLN 的调制参数 \\(a(t),b(t)\\) 也做 RMSNorm；线性层用 Lipschitz 初始化。<\/p>\n\n      <h3>工程细节<\/h3>\n      <ul class=\"plain\">\n        <li><b>梯度穿过 JVP<\/b>：与 MeanFlow、sCM 不同，\\(\\partial_sF_\\theta\\) 也参与反传，需要支持 JVP 反向的 Flash Attention 核；AdamW 的 \\(\\beta_2\\) 从 0.999 调到 0.95 平滑波动。<\/li>\n        <li><b>代理用 EMA<\/b>：\\(\\gamma=0\\) 时 FID 10.24，\\(\\gamma=0.99\\) 最好（4.90），\\(\\gamma=0.999\\) 变差（6.04）。<\/li>\n        <li><b>CFG<\/b>：目标速度换成 \\(w\\,u(\\cdot,c)+(1-w)\\,u(\\cdot)\\)，每个 \\(w\\) 训一个模型；缩放参数化 \\(f_\\theta=(s-t)\\,w\\,F_\\theta\\)，\\(w=1.5\\) 时 1-NFE FID 从 9.32 降到 6.04。<\/li>\n        <li>\\(t=s\\) 的样本约 20% 时 2 步最好；FM 项用单独的时间分布；纯 L2，不需要自适应权重或课程。<\/li>\n      <\/ul>\n      <div class=\"tablewrap\"><table class=\"cmp\">\n        <thead><tr><th>ImageNet<\/th><th>1-NFE FID<\/th><th>4-NFE FID<\/th><\/tr><\/thead>\n        <tbody><tr><td>256×256<\/td><td>3.29<\/td><td>1.99<\/td><\/tr><tr><td>512×512<\/td><td>4.32<\/td><td>2.94<\/td><\/tr><\/tbody>\n      <\/table><\/div>\n    <\/div>\n    <aside class=\"aside\"><p>Luma 还在博客里给出了 10B+ 规模的文生图结果。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>对象同 MeanFlow；对终点 \\(s\\) 求导得到终点速度条件，它上界一步位移误差。<\/span><\/li>\n      <li><span>未知的落脚点和速度用网络自己代替；条件速度只在 FM 项里，不进入 JVP。<\/span><\/li>\n      <li><span>\\(W_2\\) 上界需要 Lipschitz，所以对 DiT 做了最小的归一化改动。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "imf": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 7 讲 · 修补 MeanFlow · CVPR 2026<\/p>\n    <h1>Improved MeanFlow：<em>改成标准回归，引导可调<\/em><\/h1>\n    <p class=\"lede\">原始 MeanFlow 有两个\"快进模型\"特有的问题：回归目标里含有网络自身，引导强度在训练时写死。iMF 把损失改写成对瞬时速度的回归，把引导变成条件输入，再换成多 token 的 in-context 条件化，从头训练就做到一步 FID 1.72。<\/p>\n    <div class=\"byline\"><span>作者 <b>Geng 等<\/b><\/span><span>arXiv <b><a href=\"https://arxiv.org/abs/2512.02012\" target=\"_blank\" rel=\"noopener\">2512.02012<\/a><\/b><\/span><span>ImageNet 256 <b>1-NFE FID 1.72<\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>Eulerian (E)<\/span><span>v-loss<\/span><span>辅助速度头<\/span><span>引导作为条件<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\"><p>论文称 MeanFlow 这类模型为 fastforward（快进）生成模型：它们近似的是 ODE 的\"快进\"版本。<\/p><\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>问题一：目标里含网络自身<\/h2>\n      <p>MeanFlow 的目标是 \\(u_{\\text{tgt}}=v-(t-r)\\frac{\\mathrm d u_\\theta}{\\mathrm dt}\\)。表面上是回归，但回归目标随网络在变，不像标准的监督学习。iMF 的做法是把网络项移到预测一侧。由恒等式 \\(v=u+(t-r)\\frac{\\mathrm du}{\\mathrm dt}\\)，定义复合预测：<\/p>\n      <div class=\"display result\">$$V_\\theta\\triangleq u_\\theta+(t-r)\\cdot\\mathrm{JVP}_{\\text{sg}},\\qquad \\mathcal L=\\mathbb E\\,\\big\\|V_\\theta-v\\big\\|^2,\\quad v=\\epsilon-x. \\tag{1}\\label{eq:vloss}$$<\/div>\n      <p>现在回归目标 \\(v\\) 是固定的数据量，网络只出现在预测一侧，成了标准回归，论文称之为\"\\(v\\)-loss\"。可以把它理解为：<b>网络输出平均速度 \\(u\\)，经过恒等式换算成瞬时速度 \\(V\\)，再和 flow matching 一样去回归<\/b>。<\/p>\n\n      <h3>切向量用谁的速度<\/h3>\n      <p>JVP 仍需要一个切向量（沿 \\(z\\) 方向的速度）。iMF 比较了两种确定性的选择，都不再用带噪的条件速度：<\/p>\n      <ul class=\"plain\">\n        <li>用 \\(u_\\theta\\) 的边界条件：\\(v_\\theta=u_\\theta(z_t,t,t)\\)；<\/li>\n        <li>用一个辅助速度头单独输出 \\(v_\\theta\\)。<\/li>\n      <\/ul>\n      <div class=\"tablewrap\"><table class=\"cmp\">\n        <thead><tr><th>1-NFE FID（消融设置）<\/th><th>无 CFG<\/th><th>有 CFG<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td>原始 MF<\/td><td>32.69<\/td><td>6.17<\/td><\/tr>\n          <tr><td>\\(v\\)-loss，\\(v_\\theta=u_\\theta(z_t,t,t)\\)<\/td><td>29.42<\/td><td>5.97<\/td><\/tr>\n          <tr><td>\\(v\\)-loss，\\(v_\\theta\\) 来自辅助头<\/td><td>30.76<\/td><td>5.68<\/td><\/tr>\n        <\/tbody>\n      <\/table><\/div>\n\n      <figure class=\"lab\" data-lab=\"tangent\" data-beta=\"1\">\n        <figcaption>切向量从\"带噪的条件速度\"（β=0）换成\"确定性的速度估计\"（β=1）后，热力图里的高噪声区域消失。iMF 的辅助速度头大致对应 β=1。第 9 讲会更细地分析这个实验。<\/figcaption>\n      <\/figure>\n    <\/div>\n    <aside class=\"aside\">\n      <p>\"sg\" 表示对 JVP 那一项做 stop-gradient：梯度只经过 \\(u_\\theta\\) 本身。<\/p>\n      <p>第 9 讲的理论把辅助速度头解释为\"控制变量\"：用确定性的估计替换掉切向量里的噪声。<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>问题二：引导强度写死<\/h2>\n      <p>原始 MF 用固定的 \\(v_{\\text{cfg}}(z_t\\mid c)=\\omega\\,v(z_t\\mid c)+(1-\\omega)\\,v(z_t)\\) 作目标，\\(\\omega\\) 训练前就选定，推理时不能改。iMF 发现最优 \\(\\omega\\) 会随设置变化：越强的模型（更大、训练更久、步数更多）偏好越小的 \\(\\omega\\)。<\/p>\n      <p>做法是把引导相关的量 \\(\\Omega\\)（如引导强度）当作和 \\(t\\)、\\(r\\) 一样的条件输入：<\/p>\n      <div class=\"display\">$$u_\\theta=u_\\theta\\big(z_t\\mid r,\\,t,\\,c,\\,\\Omega\\big), \\tag{2}$$<\/div>\n      <p>训练时随机采样 \\(\\Omega\\)，推理时任意设定。<\/p>\n\n      <h3>in-context 条件化<\/h3>\n      <p>条件一多（\\(r\\)、\\(t\\)、类别、\\(\\Omega\\)），adaLN-zero 把所有条件嵌入相加，单个操作负担过重。iMF 改为每种条件用多个可学习 token（类别 8 个，其它各 4 个），与图像 token 拼接后一起送进 Transformer。DiT 当年发现 in-context 不如 adaLN-zero，iMF 发现多 token 就能补上差距，还减少了参数。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>作者在结论里提到：一步生成足够快以后，VAE 解码本身的代价变得不可忽略。这直接引出了下一讲的 pMF。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>\\(v\\)-loss：网络输出 \\(u\\)，经恒等式换算成 \\(V\\)，回归固定的 \\(v\\)，变成标准回归。<\/span><\/li>\n      <li><span>切向量改用确定性的速度估计（边界条件或辅助头），去掉了带噪的条件速度。<\/span><\/li>\n      <li><span>引导强度作为条件输入，配合多 token in-context 条件化；从头训练 1-NFE FID 1.72。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "pmf": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 8 讲 · 修补 MeanFlow · 2026<\/p>\n    <h1>Pixel MeanFlow：<em>输出空间与损失空间分开<\/em><\/h1>\n    <p class=\"lede\">在像素空间里直接预测平均速度会彻底失败。pMF 让网络输出\"去噪图像\"，再换算成速度去计算 MeanFlow 损失，实现无 VAE 的一步生成：ImageNet 256 上 FID 2.22，512 上 2.48。<\/p>\n    <div class=\"byline\"><span>作者 <b>含 Kaiming He<\/b><\/span><span>arXiv <b><a href=\"https://arxiv.org/abs/2601.22158\" target=\"_blank\" rel=\"noopener\">2601.22158<\/a><\/b><\/span><span>像素空间 <b>1-NFE FID 2.22<\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>x-预测<\/span><span>v-loss<\/span><span>流形假设<\/span><span>像素空间<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\"><p>思路来自同组的 JiT（\"Back to Basics\"）：像素空间的 Transformer 应该预测干净图像，而不是噪声或速度。<\/p><\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>去噪图像场<\/h2>\n      <p>由平均速度定义一个新的场：<\/p>\n      <div class=\"display result\">$$x(z_t,r,t)\\triangleq z_t-t\\cdot u(z_t,r,t). \\tag{1}\\label{eq:xfield}$$<\/div>\n      <p>看两个边界就知道它为什么叫\"去噪图像\"：<\/p>\n      <div class=\"derive\">\n        <div class=\"eq\">\\(\\displaystyle r=t:\\quad x=z_t-t\\,v(z_t,t)=\\mathbb E[x\\mid z_t]\\)<\/div>\n        <div class=\"why\">平均速度变成瞬时速度，\\(x\\) 是普通的<b>去噪估计<\/b><\/div>\n        <div class=\"eq\">\\(\\displaystyle r=0:\\quad x=z_t-t\\cdot\\frac{z_t-X_{t\\to0}(z_t)}{t}=X_{t\\to0}(z_t)\\)<\/div>\n        <div class=\"why\">就是流映射的终点，即一张<b>真实图像<\/b><\/div>\n      <\/div>\n      <p>中间的 \\(r\\) 是两者之间的过渡。论文提出\"广义流形假设\"：\\(x\\) 近似落在低维的图像流形上；而 \\(u\\) 是带噪声的量，铺满整个高维空间。<\/p>\n\n      <figure class=\"lab\" data-lab=\"manifold\">\n        <figcaption>数据分布在一个圆上（一维流形）。左边是 <span class=\"hl-b\">u 的取值<\/span>，右边是 <span class=\"hl-a\">x 的取值<\/span>。x 始终贴着一条曲线，u 弥散地铺满平面。图像是几万维的，这种差别就决定了网络能不能拟合。<\/figcaption>\n      <\/figure>\n    <\/div>\n    <aside class=\"aside\"><p>为什么 \\(r=t\\) 时是去噪估计：\\(v=\\mathbb E[\\epsilon-x\\mid z_t]\\)，而 \\(z_t=(1-t)x+t\\epsilon\\)，代入整理即得。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>算法<\/h2>\n      <p>网络直接输出 \\(x_\\theta\\)，换算成平均速度，再沿用 iMF 的 \\(v\\)-loss：<\/p>\n      <div class=\"derive\">\n        <div class=\"eq\">\\(\\displaystyle u_\\theta(z_t,r,t)=\\tfrac1t\\big(z_t-x_\\theta(z_t,r,t)\\big)\\)<\/div>\n        <div class=\"why\">由式 (1) 反解<\/div>\n        <div class=\"eq\">\\(\\displaystyle V_\\theta=u_\\theta+(t-r)\\cdot\\mathrm{JVP}_{\\text{sg}}\\)<\/div>\n        <div class=\"why\">iMF 的复合预测<\/div>\n        <div class=\"eq\">\\(\\displaystyle \\mathcal L_{\\text{pMF}}=\\mathbb E\\,\\|V_\\theta-v\\|^2\\)<\/div>\n        <div class=\"why\"><b>\\(x\\)-预测、\\(v\\)-损失<\/b><\/div>\n      <\/div>\n      <p>可以再加一个感知损失（在 \\(x_\\theta\\) 上算），也按 iMF 的方式支持 CFG。采样时 \\(x=x_\\theta(\\epsilon,0,1)\\)，一次前向直接输出像素。<\/p>\n\n      <h3>消融<\/h3>\n      <div class=\"tablewrap\"><table class=\"cmp\">\n        <thead><tr><th>设置<\/th><th>1-NFE FID<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td>64×64，patch 维度 48：\\(x\\)-预测 / \\(u\\)-预测<\/td><td>3.80 / 3.82<\/td><\/tr>\n          <tr><td>256×256，patch 维度 768：\\(x\\)-预测 / \\(u\\)-预测<\/td><td>9.56 / 164.89<\/td><\/tr>\n          <tr><td>加 EDM 式预条件（输出不再直接是 \\(x\\)）<\/td><td>14.43（无预条件 3.53）<\/td><\/tr>\n        <\/tbody>\n      <\/table><\/div>\n      <p>patch 维度低于网络宽度时两种预测都行；patch 维度一高，\\(u\\)-预测直接崩溃。任何把网络输出变换成 \\(x\\) 的预条件器都会让输出偏离流形，显著变差。另外 Muon 优化器比 Adam 收敛快，感知损失有明显帮助。<\/p>\n\n      <div class=\"tablewrap\"><table class=\"cmp\">\n        <thead><tr><th>ImageNet<\/th><th>1-NFE FID<\/th><\/tr><\/thead>\n        <tbody><tr><td>256×256（像素空间）<\/td><td>2.22<\/td><\/tr><tr><td>512×512（像素空间）<\/td><td>2.48<\/td><\/tr><\/tbody>\n      <\/table><\/div>\n    <\/div>\n    <aside class=\"aside\"><p>这条线的逻辑很清楚：MeanFlow → iMF（\\(v\\)-loss）→ pMF（\\(x\\)-预测）。每一步只改一件事。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>定义 \\(x=z_t-t\\,u\\)：\\(r=t\\) 是去噪估计，\\(r=0\\) 是流映射终点，都在图像流形附近。<\/span><\/li>\n      <li><span>网络输出 \\(x\\)，换算成 \\(u\\) 再用 \\(v\\)-loss：输出空间和损失空间分开设计。<\/span><\/li>\n      <li><span>高维像素空间里 \\(u\\)-预测会崩溃，\\(x\\)-预测可行；一步、无 VAE 做到 FID 2.22。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "mfvar": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 9 讲 · 修补 MeanFlow · 2026<\/p>\n    <h1>MeanFlow 方差削减：<em>条件速度的两个角色<\/em><\/h1>\n    <p class=\"lede\">MeanFlow 训练时损失不降、梯度方差无界。这篇论文给出统计解释：条件速度在损失里同时扮演\"回归目标\"和\"JVP 切向量\"，后一个角色的系数取错了。由此导出最优混合系数，并把同期的各种补救方法统一起来。<\/p>\n    <div class=\"byline\"><span>arXiv <b><a href=\"https://arxiv.org/abs/2605.09235\" target=\"_blank\" rel=\"noopener\">2605.09235<\/a><\/b><\/span><span>实验 <b>2D 基准 + 潜空间 DiT<\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>理论分析<\/span><span>控制变量<\/span><span>偏差–方差<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\"><p>这一讲的实验最值得花时间玩：它直接展示了\"无界方差\"长什么样。<\/p><\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>把噪声拆出来<\/h2>\n      <p>把条件速度写成边缘速度加零均值噪声：\\(v_{\\text{cond}}=v(z,t)+v'\\)，\\(\\mathbb E[v'\\mid z_t]=0\\)，协方差 \\(\\Sigma_{v'}\\)。MeanFlow 损失里 \\(v_{\\text{cond}}\\) 出现两次：作为回归目标，以及作为 JVP 切向量。代入后取条件期望：<\/p>\n      <div class=\"display result\">$$\\mathbb E\\big[\\ell_{\\text{MF}}\\big]=\\big\\|r^{\\text{sg}}_\\theta\\big\\|^2+\\mathrm{sg}\\big[\\mathrm{Tr}\\big(\\class{tb}{J}\\,\\Sigma_{v'}\\,\\class{tb}{J}^\\top\\big)\\big],\\qquad J=(t-r)\\,\\partial_{z}u_\\theta-I. \\tag{1}\\label{eq:decomp}$$<\/div>\n      <p>第一项是真正想最小化的残差；第二项来自噪声。两个角色的区别：<\/p>\n      <ul class=\"plain\">\n        <li><b>作为回归目标<\/b>：噪声以加性方式进入，贡献一个与参数无关的噪声底，无害；<\/li>\n        <li><b>作为切向量<\/b>：噪声经过 <span class=\"hl-b\">Jacobian 因子 \\(J\\)<\/span> 乘性放大，贡献 \\(\\mathrm{Tr}(J\\Sigma J^\\top)\\)，随 \\(J\\) 的谱无界增长。损失不降、梯度方差大，主要来自这里。<\/li>\n      <\/ul>\n      <p>对真实平均速度有 \\((t-r)\\partial_z u=I-\\nabla_z X_{t\\to r}\\)，所以 \\(J=-\\nabla_z X_{t\\to r}\\)：<b>噪声被放大多少，取决于流映射把空间拉伸了多少<\/b>。流映射在不同模式的分界处拉伸最厉害，那里的噪声也最大。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>式 (1) 里的 \\(r^{\\text{sg}}_\\theta=u_\\theta+(t-r)\\,\\mathrm{sg}[\\partial_zu_\\theta\\,v+\\partial_tu_\\theta]-v\\)，是用真实边缘速度时的残差。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>切向量混合与最优系数<\/h2>\n      <p>把切向量换成条件速度与一个确定性代理 \\(\\hat v\\)（例如速度网络）的混合：<\/p>\n      <div class=\"display\">$$\\tilde v_{\\text{tang}}(\\beta)=(1-\\beta)\\,v_{\\text{cond}}+\\beta\\,\\hat v=v+(1-\\beta)\\,v'+\\beta\\,b, \\tag{2}$$<\/div>\n      <p>其中 \\(b=\\hat v-v\\) 是代理的偏差。\\(\\beta=0\\) 是原始 MeanFlow，\\(\\beta=1\\) 完全用代理。单样本梯度里，噪声项按 \\(\\big((1-\\beta)J-\\beta I\\big)v'\\) 缩放，偏差项按 \\(\\beta(J+I)b\\) 缩放，于是有偏差–方差权衡，在各向同性近似下最优 \\(\\beta^\\ast\\) 有闭式解。<\/p>\n\n      <figure class=\"lab\" data-lab=\"tangent\" data-beta=\"0\">\n        <figcaption>颜色是每个位置上目标噪声的大小 \\(\\mathrm{Tr}(A\\Sigma A^\\top)\\)，\\(A=\\beta I+(1-\\beta)\\nabla_zX_{t\\to r}\\)（这里代理取真实速度，偏差为 0）。β=0 时<b>大部分位置噪声不大，但模式分界处有极端的热点<\/b>：中位数很小、均值和最大值却很大，这就是\"无界方差\"。跨度 Δ 越大，热点越强。<\/figcaption>\n      <\/figure>\n\n      <h3>统一同期的补救方法<\/h3>\n      <ul class=\"plain\">\n        <li><b>iMF<\/b>：用学到的边缘速度头代替切向量，相当于 \\(\\beta=1\\) 的一种实现；<\/li>\n        <li><b>AlphaFlow<\/b>：把慢收敛归因于 FM 项与一致性项的梯度冲突，用 \\(\\alpha\\) 课程；<\/li>\n        <li><b>Re-MeanFlow<\/b>：先用 rectified flow 拉直数据，降低轨迹曲率；<\/li>\n        <li><b>TVM<\/b>：对终点时间求导，绕开空间 Jacobian。<\/li>\n      <\/ul>\n      <p>作者说明这些都对应同一个最优点的不同实现。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>实验中代理取真实速度（偏差为 0），所以 β=1 时只剩回归目标本身的噪声底 \\(\\mathrm{Tr}\\,\\Sigma\\)。真实训练中代理有偏差，β 不能直接取 1。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">3<\/span>出人意料的结论<\/h2>\n      <p>在二维基准和潜空间 DiT 上扫描 \\(\\beta\\)，梯度均方误差的排序和理论预测一致。但 DiT 实验揭示了一个\"景观错配\"：<\/p>\n      <ul class=\"plain\">\n        <li>梯度 MSE 在 \\(\\beta\\approx0.94\\) 时最小；<\/li>\n        <li>FID 最好的却是 \\(\\beta=0\\)，即直接用无偏的条件速度。<\/li>\n      <\/ul>\n      <p>FID 对偏差的惩罚比梯度 MSE 强得多，大约是 2.6 倍的超线性放大，于是 FID 最优点越过了 MSE 最优点，一直移到无偏端。<b>方差最优不等于生成质量最优。<\/b>这也提醒我们：iMF 的辅助头之所以有效，可能不只是因为降了方差。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>这个结论和第 11 讲 TE-MeanFlow 的思路互补：与其消掉噪声，不如在不同时间尺度之间均衡噪声。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>条件速度作为回归目标无害，作为 JVP 切向量会被 \\(J=-\\nabla_zX_{t\\to r}\\) 乘性放大。<\/span><\/li>\n      <li><span>切向量混合系数 \\(\\beta\\) 带来偏差–方差权衡，最优值有闭式解；iMF、AlphaFlow、TVM 等都是它的不同实现。<\/span><\/li>\n      <li><span>梯度方差最优（\\(\\beta\\approx0.94\\)）不等于 FID 最优（\\(\\beta=0\\)）。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "esc": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 10 讲 · 修补 MeanFlow · 2025<\/p>\n    <h1>ESC：<em>捷径模型的设计空间<\/em><\/h1>\n    <p class=\"lede\">把 Shortcut、一致性训练、MeanFlow、IMM 写进同一个框架：\"一步预测去逼近两步构造的目标\"。目标偏离真实轨迹带来偏差和方差，于是逐个组件改进，最有代表性的是用整批样本估计边缘速度的 plug-in 速度。<\/p>\n    <div class=\"byline\"><span>arXiv <b><a href=\"https://arxiv.org/abs/2512.11831\" target=\"_blank\" rel=\"noopener\">2512.11831<\/a><\/b><\/span><span>ImageNet 256 <b>1-NFE FID 2.85 / 2.53<\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>统一框架<\/span><span>plug-in 速度<\/span><span>从头训练<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\"><p>原文把从头训练的一步捷径模型分成离散时间（DTSC）与连续时间（CTSC）两类。<\/p><\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>统一框架：一步预测，两步目标<\/h2>\n      <p>所有捷径模型都利用半群性质 \\(X_{s,r}(X_{t,s}(x_t))=X_{t,r}(x_t)\\)：先用网络输出（或条件速度）构造一个两步的目标 \\(t\\to s\\to r\\)，再让一步预测 \\(X^\\theta_{t,r}\\) 去逼近它。<\/p>\n      <p>理想情况下，两步目标经过的 \\(\\hat x_s\\)、\\(\\hat x_r\\) 都在真实轨迹上；实际上，它们是用网络输出或条件速度估计的，必然偏离轨迹，给监督带来<span class=\"hl-b\">偏差<\/span>和<span class=\"hl-b\">方差<\/span>。论文用命题 3.1 量化了这一点，并据此解释了一个常见现象：<b>为什么蒸馏通常比从头训练好<\/b>。蒸馏时目标里的条件速度被预训练速度场代替，后者接近真实边缘速度，两步目标就准得多。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>MeanFlow 是连续时间的特例：两步之间的间隔趋于 0，两步目标变成恒等式右边。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>设计空间中的几个问题<\/h2>\n      <p><b>线性路径还是余弦路径？<\/b>在统一代码库下比较，线性路径更好。作者的解释是线性路径诱导的边缘速度场传输代价更低、轨迹曲率更小，两步目标不容易偏离；并证明了在以数据样本为条件时，线性路径对捷径模型是最优的。<\/p>\n      <p><b>plug-in 速度。<\/b>既然条件速度噪声大，就用整批样本估计边缘速度。对批内样本 \\(x_j\\)，按 \\(p(z_t\\mid x_j)\\) 自归一化加权：<\/p>\n      <div class=\"display result\">$$\\hat v(z_t)=\\sum_j w_j\\,\\frac{z_t-x_j}{t},\\qquad w_j\\propto q(x_j)\\,p(z_t\\mid x_j). \\tag{1}\\label{eq:plugin}$$<\/div>\n      <p>论文证明了使用 plug-in 速度时损失的收敛性：权重的误差可以用分布之间的 \\(W_1\\) 距离控制。<\/p>\n\n      <figure class=\"lab\" data-lab=\"plugin\">\n        <figcaption>二维例子里，<span class=\"hl-b\">条件速度<\/span>的误差与批大小无关，<span class=\"hl-a\">plug-in 估计<\/span>的误差约按 1/B 下降。高维时权重容易被少数样本主导，收益会小得多。<\/figcaption>\n      <\/figure>\n\n      <p><b>同类别成批。<\/b>条件生成时，plug-in 估计要求批内样本来自同一类别，否则不同类别的数据会混进同一个估计里。<\/p>\n      <p><b>其它组件。<\/b>渐进的时间采样器，以及引入 sCM 的训练技巧。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>plug-in 速度并不是在每个样本上都用：论文按一定概率 \\(p_{\\text{plug-in}}\\) 替换条件速度（如 0.5）。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">3<\/span>结果<\/h2>\n      <div class=\"tablewrap\"><table class=\"cmp\">\n        <thead><tr><th>设置<\/th><th>1-NFE FID<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td>消融：MeanFlow（CFG）基线<\/td><td>6.09<\/td><\/tr>\n          <tr><td>+ plug-in 速度（p=0.5）+ 同类别成批<\/td><td>5.96<\/td><\/tr>\n          <tr><td>+ 渐进时间采样 + sCM 技巧 = ESC<\/td><td>5.77<\/td><\/tr>\n          <tr><td>ImageNet 256，CFG，一步<\/td><td>2.85<\/td><\/tr>\n          <tr><td>同上，训练步数加倍<\/td><td>2.53<\/td><\/tr>\n          <tr><td>CIFAR-10（MeanFlow 2.92，sCT 2.97，IMM 3.20）<\/td><td>2.83<\/td><\/tr>\n        <\/tbody>\n      <\/table><\/div>\n      <p>每个组件单独的提升都在 0.1 量级，叠加后才明显。不需要预训练、蒸馏或课程。<\/p>\n    <\/d
