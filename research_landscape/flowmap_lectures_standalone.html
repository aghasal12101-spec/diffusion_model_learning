iv>\n    <aside class=\"aside\"><p>这篇适合当作 MeanFlow 系方法的\"设计空间综述\"来读。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>统一框架：一步预测逼近两步目标；目标偏离真实轨迹是偏差和方差的来源。<\/span><\/li>\n      <li><span>plug-in 速度用整批样本加权估计边缘速度，降低目标噪声，配合同类别成批。<\/span><\/li>\n      <li><span>线性路径更适合捷径模型；各组件叠加，一步 FID 2.85（训练加倍后 2.53）。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "temf": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 11 讲 · 修补 MeanFlow · CVPR 2026<\/p>\n    <h1>TE-MeanFlow：<em>让不同时间尺度说话一样大声<\/em><\/h1>\n    <p class=\"lede\">MeanFlow 一提高 \\(r\\ne t\\) 的样本比例，性能就明显下降。原因是\"时间尺度失衡\"：不同跨度 \\(\\Delta=t-r\\) 的样本对梯度的贡献相差悬殊。TE-MeanFlow 用一个均衡权重和一个动态边界调度来调和，不改架构，一步 FID 2.62。<\/p>\n    <div class=\"byline\"><span>CVPR 2026 <b><a href=\"https://openaccess.thecvf.com/content/CVPR2026/papers/Tu_Temporal_Equilibrium_MeanFlow_Bridging_the_Scale_Gap_for_One-Step_Generation_CVPR_2026_paper.pdf\" target=\"_blank\" rel=\"noopener\">论文 PDF<\/a><\/b><\/span><span>ImageNet 256 <b>1-NFE 2.62 · 2-NFE 2.30<\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>Eulerian (E)<\/span><span>损失加权<\/span><span>训练调度<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\"><p>论文图 2：不同大小的 DiT 下，MeanFlow 的一步 FID 都对 \\(r\\ne t\\) 比例非常敏感。<\/p><\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>两种相反的需求<\/h2>\n      <p>训练 MeanFlow 时，有两股力量在拉扯：<\/p>\n      <ul class=\"plain\">\n        <li>在生成的起点附近（\\(r\\approx t\\)），需要强的边界约束，它们提供稳定的训练信号；<\/li>\n        <li>跨度大的项会放大方差，却又是学会长距离跳跃所必需的。<\/li>\n      <\/ul>\n      <p>固定的时间采样策略没法同时满足两者。作者先给出方差随跨度变化的模型：<\/p>\n      <div class=\"display\">$$\\mathrm{Var}[u_{\\text{tgt}}]\\le\\frac{C_1}{\\Delta}+C_2\\,\\Delta^2+O(\\Delta^3), \\tag{1}\\label{eq:te-var}$$<\/div>\n      <p>单样本梯度为 \\(\\nabla_\\theta\\mathcal L_{\\text{MF}}=2\\,(u_\\theta-u_{\\text{tgt}})\\cdot\\nabla_\\theta u_\\theta\\)，所以不同 \\(\\Delta\\) 的样本对梯度的贡献很不均衡。<\/p>\n\n      <figure class=\"lab\" data-lab=\"delta\">\n        <figcaption>二维例子里，原始目标（β=0）噪声分布的<span class=\"hl-b\">尾部<\/span>随跨度增大几个数量级，中位数反而下降：大跨度样本偶尔会产生极端的目标。<span class=\"hl-a\">确定性切向量<\/span>（β=1）几乎不受跨度影响。论文式 (1) 中的 \\(1/\\Delta\\) 项来自它自己的分析设定，这里没有复现；实验想说明的是同一点：不同跨度的样本，对梯度的影响量级可以相差很大。<\/figcaption>\n      <\/figure>\n    <\/div>\n    <aside class=\"aside\"><p>\\(\\Delta\\) 越小越接近 flow matching；\\(\\Delta\\) 越大越接近一步生成。两者都要学，但它们的\"音量\"差得太多。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>两个组件<\/h2>\n      <h3>时间均衡权重<\/h3>\n      <p>目标是让每个跨度对梯度方差的贡献相同。由 \\(\\nabla_\\theta\\mathcal L_{\\text{TEMF}}\\approx w(\\Delta)\\,\\nabla_\\theta\\mathcal L_{\\text{MF}}\\) 和式 \\eqref{eq:te-var}，理想权重满足<\/p>\n      <div class=\"display\">$$w(\\Delta)^2\\Big(\\frac{C_1}{\\Delta}+C_2\\Delta^2\\Big)=\\text{常数}, \\tag{2}$$<\/div>\n      <p>论文用一个有界的函数族 \\(1/\\big[(1+\\lambda_1\\Delta^{\\beta_1})\\sqrt{1+\\lambda_2\\Delta^2}\\big]\\) 来近似这个理想解，保证加权后的梯度方差在整个 \\(\\Delta\\) 范围内有统一上界。<\/p>\n      <h3>动态边界调度<\/h3>\n      <p>最合适的边界约束强度在训练中是变化的：早期需要强调 \\(r\\approx t\\) 的边界样本，把速度场学稳；后期再逐渐把重心移到轨迹精修上。TE-MeanFlow 用一个随训练进度变化的调度来实现这种转移。<\/p>\n\n      <div class=\"tablewrap\"><table class=\"cmp\">\n        <thead><tr><th>ImageNet 256，带 CFG<\/th><th>FID<\/th><\/tr><\/thead>\n        <tbody><tr><td>1-NFE<\/td><td>2.62<\/td><\/tr><tr><td>2-NFE<\/td><td>2.30<\/td><\/tr><\/tbody>\n      <\/table><\/div>\n      <p>作者称这是扩散和流模型中一步方法的最好结果（在其对比范围内），并且不改架构、仍是真正的一步生成。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>和第 9 讲对照：方差削减是在\"每个样本内部\"降噪，TE-MeanFlow 是在\"不同样本之间\"重新分配权重。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>MeanFlow 的不稳定部分来自时间尺度失衡：不同跨度的目标方差量级不同。<\/span><\/li>\n      <li><span>均衡权重让各跨度对梯度方差的贡献相当；动态调度让训练重心从边界稳定转向轨迹精修。<\/span><\/li>\n      <li><span>不改架构，一步 FID 2.62，两步 2.30。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "soflow": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 12 讲 · 去掉 JVP · 2025<\/p>\n    <h1>SoFlow：<em>用有限差分代替 JVP<\/em><\/h1>\n    <p class=\"lede\">直接学 ODE 的\"解函数\"，用一个不需要 JVP 的解一致性损失加 flow matching 损失训练。在相同 DiT 架构和训练轮数下，各个模型尺寸都优于 MeanFlow。<\/p>\n    <div class=\"byline\"><span>arXiv <b><a href=\"https://arxiv.org/abs/2512.15657\" target=\"_blank\" rel=\"noopener\">2512.15657<\/a><\/b><\/span><span>ImageNet 256 <b>XL/2 1-NFE FID 2.96<\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>Eulerian (E)<\/span><span>有限差分<\/span><span>无 JVP<\/span><span>从头训练<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\"><p><b>原文记号<\/b><\/p><p>\\(x_t=\\alpha_tx_0+\\beta_tx_1\\)，\\(x_0\\) 为数据、\\(x_1\\) 为噪声；解函数 \\(f(x_t,t,s)\\) 从 \\(t\\) 到 \\(s\\le t\\)。和讲义统一记号的方向一致。<\/p><\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>为什么要去掉 JVP<\/h2>\n      <p>MeanFlow 一类方法每一步都要一次 JVP。PyTorch 对 JVP 的支持不好，尤其是注意力层，显存和速度代价都高；sCM、TVM、FACM 都专门写了 JVP 核才能扩展。另外，训练中需要一个速度估计用于 CFG。SoFlow 想同时解决这两件事。<\/p>\n    <\/div>\n    <aside class=\"aside\"><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>解函数的两个充分条件<\/h2>\n      <p>假设速度场连续可微且关于 \\(x\\) 全局 Lipschitz，由 ODE 解的存在唯一性，解函数 \\(f(x_t,t,s)\\) 唯一，并满足<\/p>\n      <div class=\"display\">$$f(x_t,t,t)=x_t,\\qquad \\partial_3 f(x_t,t,s)=v\\big(f(x_t,t,s),s\\big). \\tag{1}$$<\/div>\n      <p>作者证明，模型只要满足下面两个条件就等于真实解函数：<\/p>\n      <div class=\"display result\">$$f_\\theta(x_t,t,t)=x_t,\\qquad \\partial_1 f_\\theta(x_t,t,s)\\,v(x_t,t)+\\partial_2 f_\\theta(x_t,t,s)=0. \\tag{2}\\label{eq:so-cond}$$<\/div>\n      <details>\n        <summary>证明思路<\/summary>\n        <div>\n          <div class=\"derive\">\n            <div class=\"eq\">\\(\\displaystyle \\frac{\\partial}{\\partial l}f_\\theta\\big(f(x_t,t,l),l,s\\big)=\\partial_1f_\\theta\\cdot v+\\partial_2f_\\theta=0\\)<\/div>\n            <div class=\"why\">沿真实轨迹移动起点 \\(l\\)，由式 (2) 第二式<\/div>\n            <div class=\"eq\">\\(\\displaystyle f_\\theta(x_t,t,s)=f_\\theta\\big(f(x_t,t,s),s,s\\big)\\)<\/div>\n            <div class=\"why\">关于 \\(l\\) 不变，把 \\(l\\) 从 \\(t\\) 移到 \\(s\\)<\/div>\n            <div class=\"eq\">\\(\\displaystyle \\phantom{f_\\theta(x_t,t,s)}=f(x_t,t,s)\\)<\/div>\n            <div class=\"why\">边界条件 \\(f_\\theta(\\cdot,s,s)=\\mathrm{id}\\)<\/div>\n          <\/div>\n        <\/div>\n      <\/details>\n      <p>第二个条件就是 Eulerian 方程：起点沿轨迹移动，终点不变。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>这个证明和导论里 (E) 的推导是同一件事倒过来看。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">3<\/span>不用 JVP 的解一致性损失<\/h2>\n      <p>取 \\(l\\in(s,t)\\) 并靠近 \\(t\\)，用有限差分近似式 \\eqref{eq:so-cond} 里的导数：<\/p>\n      <div class=\"display\">$$\\frac{f_\\theta(x_t,t,s)-f_\\theta\\big(x_t+v(x_t,t)(l-t),\\,l,\\,s\\big)}{t-l}=\\partial_1f_\\theta\\,v+\\partial_2f_\\theta+o(1). \\tag{3}$$<\/div>\n      <p>于是得到解一致性损失（速度用条件速度代替）：<\/p>\n      <div class=\"display result\">$$\\mathcal L_{\\text{SCM}}=\\mathbb E\\Big[\\tfrac{w}{n}\\,\\big\\|f_\\theta(x_t,t,s)-f_{\\theta^-}\\big(x_t+(\\alpha_t'x_0+\\beta_t'x_1)(l-t),\\,l,\\,s\\big)\\big\\|^2\\Big]. \\tag{4}\\label{eq:scm}$$<\/div>\n      <ul class=\"plain\">\n        <li><b>\\(l\\) 的课程<\/b>：\\(l=t+(s-t)\\,r(k,K)\\)，\\(r\\) 随训练步数单调减小，让 \\(l\\) 逐渐靠近 \\(t\\)。这和 ECT、sCM 的\"逐步收紧\"一脉相承：早期差分步长大、目标平滑，后期步长小、更接近真实导数。<\/li>\n        <li><b>权重<\/b>：\\(w=\\frac{1}{(t-l)|b(t,s)|}\\cdot\\frac{1}{(\\text{MSE}/(t-l)^2+\\epsilon)^p}\\)，前者稳定原始网络的梯度大小，后者是鲁棒损失。<\/li>\n        <li><b>flow matching 损失<\/b>：同时训练 \\(s=t\\) 处的速度，这样训练中就有速度估计可以用于 CFG。<\/li>\n      <\/ul>\n\n      <figure class=\"lab\" data-lab=\"finite\">\n        <figcaption>沿二维例子的真实轨迹估计 \\(\\mathrm du/\\mathrm dt\\)。<span class=\"hl-b\">截断误差<\/span>随步长缩小，但网络输出的随机误差会被差分放大约 \\(1/h\\) 倍，合计误差呈 U 形。网络越准，最优步长越小：这就是 \\(l\\) 的课程随训练逐渐靠近 \\(t\\) 的理由。<\/figcaption>\n      <\/figure>\n    <\/div>\n    <aside class=\"aside\"><p>式 (4) 的速度用的仍是条件速度，只是它不再进 JVP，而是进差分的\"位移\"里。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">4<\/span>结果<\/h2>\n      <div class=\"tablewrap\"><table class=\"cmp\">\n        <thead><tr><th>模型<\/th><th>MeanFlow 1-NFE<\/th><th>SoFlow 1-NFE<\/th><\/tr><\/thead>\n        <tbody><tr><td>B/2<\/td><td>6.17<\/td><td>4.85<\/td><\/tr><tr><td>M/2<\/td><td>5.01<\/td><td>3.73<\/td><\/tr><tr><td>L/2<\/td><td>3.84<\/td><td>3.20<\/td><\/tr><tr><td>XL/2<\/td><td>3.43<\/td><td>2.96<\/td><\/tr><\/tbody>\n      <\/table><\/div>\n      <p>ImageNet 256，FID-50K，相同 DiT 架构与训练轮数。<\/p>\n    <\/div>\n    <aside class=\"aside\"><\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>学 ODE 解函数；边界条件 + Eulerian 方程是它的充分条件。<\/span><\/li>\n      <li><span>用有限差分代替导数，得到不需要 JVP 的解一致性损失；差分步长按课程逐渐收紧。<\/span><\/li>\n      <li><span>同架构同轮数下各尺寸都优于 MeanFlow（XL/2：2.96 vs 3.43）。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "emf": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 13 讲 · 去掉 JVP · 2026<\/p>\n    <h1>Euler Mean Flows：<em>把半群局部线性化<\/em><\/h1>\n    <p class=\"lede\">从半群关系出发，对很短的一步做局部线性近似，把长程一致性目标改写成可以直接用数据监督、又不需要 JVP 的形式。同等 DiT-B 设置下，显存和单步耗时约减半，FID 也好于 MeanFlow。<\/p>\n    <div class=\"byline\"><span>arXiv <b><a href=\"https://arxiv.org/abs/2602.02571\" target=\"_blank\" rel=\"noopener\">2602.02571<\/a><\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>半群 (S)<\/span><span>局部线性化<\/span><span>无 JVP<\/span><span>从头训练<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\"><p><b>原文记号<\/b><\/p><p>原文 \\(t=0\\) 为噪声，从 \\(t\\) 走向更大的 \\(r\\)；平均速度 \\(u_{t\\to r}(x)=\\frac{\\phi_{t\\to r}(x)-x}{r-t}\\)。本讲保留原文写法。<\/p><\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>轨迹一致性为什么难<\/h2>\n      <p>流映射有两类约束：边界条件（\\(\\phi_{t\\to t}=\\mathrm{id}\\)，起点导数为速度）和轨迹一致性（半群）。边界条件可以直接用数据监督，轨迹一致性却很难：<\/p>\n      <ul class=\"plain\">\n        <li>半群约束本身有无穷多解，单靠它引入不了数据信息；<\/li>\n        <li>流映射没有像条件速度那样的\"条件版本\"。论文给出证明：不存在一个与条件速度相容、又能通过取期望得到边缘流映射的条件流映射。<\/li>\n      <\/ul>\n      <p>已有方法分两派：Shortcut、SplitMF 先学瞬时速度，再用半群逐步延伸到长程，监督间接、误差累积；MeanFlow 用连续方程，监督更直接，但需要 JVP。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>这里的\"不存在条件流映射\"，就是导论里\"不能直接回归\"在理论上的严格版本。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>局部线性化<\/h2>\n      <p>用平均速度改写半群关系（\\(t\\le s\\le r\\)）：<\/p>\n      <div class=\"display\">$$(r-t)\\,u_{t\\to r}(x_t)=(s-t)\\,u_{t\\to s}(x_t)+(r-s)\\,u_{s\\to r}(x_s). \\tag{1}$$<\/div>\n      <p>EMF 的关键选择是让 \\(s\\) 紧挨着 \\(t\\)：\\(s=t+\\Delta t\\)，\\(\\Delta t\\) 是一个固定的小步长。对很短的一步，流映射可以线性近似，于是 \\(u_{t\\to s}\\approx u_{t\\to t}\\)，即瞬时速度：<\/p>\n      <div class=\"display result\">$$u_{t\\to r}(x_t)\\approx\\class{ta}{u_{t\\to t}(x_t)}+(r-t-\\Delta t)\\,\\frac{\\class{tb}{u_{t+\\Delta t\\to r}(x_{t+\\Delta t})-u_{t\\to r}(x_t)}}{\\Delta t}. \\tag{2}\\label{eq:emf}$$<\/div>\n      <p><span class=\"hl-a\">第一项<\/span>是瞬时速度，可以用数据的条件速度代替，这就是\"直接的数据监督\"；<span class=\"hl-b\">第二项<\/span>是平均速度沿时间的有限差分，相当于 MeanFlow 修正项的离散版本，不需要 JVP。定理 4.3 在对流映射的合理假设（Assumption 1）下证明了这个近似的有效性。论文还给出了 \\(x_1\\)-预测的变体。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>和 SoFlow 对照：两者都用差分代替 JVP；SoFlow 从 Eulerian 方程出发，EMF 从半群关系出发，用的是\"紧挨着的一小步\"。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">3<\/span>代价与结果<\/h2>\n      <div class=\"tablewrap\"><table class=\"cmp\">\n        <thead><tr><th>数据（DiT-B，同等算力）<\/th><th>方法<\/th><th>峰值显存<\/th><th>每步耗时<\/th><th>FID<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td>CelebA-HQ<\/td><td>MeanFlow<\/td><td>32.1 GB<\/td><td>151.4 ms<\/td><td>12.4<\/td><\/tr>\n          <tr><td>CelebA-HQ<\/td><td>EMF<\/td><td>23.3 GB<\/td><td>91.2 ms<\/td><td>10.9<\/td><\/tr>\n          <tr><td>ImageNet<\/td><td>MeanFlow<\/td><td>101.9 GB<\/td><td>400.9 ms<\/td><td>11.1<\/td><\/tr>\n          <tr><td>ImageNet<\/td><td>EMF<\/td><td>57.9 GB<\/td><td>198.8 ms<\/td><td>7.2<\/td><\/tr>\n        <\/tbody>\n      <\/table><\/div>\n      <p>原文表 6，比较的是相同架构与算力下的训练目标。作者把扩展到更大模型、更多任务和更一般的理论设定列为未来工作。<\/p>\n    <\/div>\n    <aside class=\"aside\"><\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>轨迹一致性难在：半群有无穷多解，也不存在条件流映射。<\/span><\/li>\n      <li><span>取紧挨着的一小步做局部线性化，瞬时速度用数据监督，长程部分用有限差分，不需要 JVP。<\/span><\/li>\n      <li><span>显存与耗时约减半，同等设置下 FID 优于 MeanFlow。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "cumflow": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 14 讲 · 扩展 · 2026<\/p>\n    <h1>Cumulative Flow Maps：<em>不只是 u-预测<\/em><\/h1>\n    <p class=\"lede\">MeanFlow 绑定在 \\(u\\)-预测的 flow matching 上。这篇论文把扩散、score matching、flow matching 统一成连续时间马尔可夫过程，提出与具体预测量无关的\"累积流映射\"，让 EDM、DDIM、\\(x_1\\)-预测等参数化都能变成少步模型。主要面向图形学任务。<\/p>\n    <div class=\"byline\"><span>arXiv <b><a href=\"https://arxiv.org/abs/2605.03623\" target=\"_blank\" rel=\"noopener\">2605.03623<\/a><\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>统一参数化<\/span><span>半群<\/span><span>图形学应用<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\"><p>原文 \\(t=0\\) 为起点（噪声），\\(t=1\\) 为数据。<\/p><\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>动机<\/h2>\n      <p>图形学里常用的生成模型五花八门：几何分布用 EDM，关节预测用 DDIM，SDF 生成用 \\(x_1\\)-预测的 flow matching。MeanFlow 一类方法的公式和 \\(u\\)-预测绑在一起，很难直接迁移。作者想要一个只改训练目标、不改网络、不需要蒸馏的通用少步方案。<\/p>\n    <\/div>\n    <aside class=\"aside\"><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>瞬时流映射与累积流映射<\/h2>\n      <p><b>瞬时流映射。<\/b>各种多步模型都学一个局部量 \\(m_t(x)\\)（如速度、噪声、干净样本），通过短时转移 \\(\\psi_{t\\to t+h}(x)=F[m_t(x),x,t,t+h]\\) 逐步采样。\\(F\\) 是一个抽象函数，具体形式由参数化决定。<\/p>\n      <p><b>累积流映射。<\/b>把短时转移复合起来取极限，得到有限时间的转移：<\/p>\n      <div class=\"display\">$$\\psi_{t\\to r}(x)=\\lim_{\\max_i|t_i-t_{i-1}|\\to0}\\psi_{t_{n-1}\\to r}\\big(\\cdots\\psi_{t\\to t_1}(x)\\big), \\tag{1}$$<\/div>\n      <p>它天然满足半群性质 \\(\\psi_{t\\to r}=\\psi_{s\\to r}\\circ\\psi_{t\\to s}\\)。<b>累积参数化场<\/b> \\(m_{t\\to r}\\) 定义为满足<\/p>\n      <div class=\"display result\">$$\\psi_{t\\to r}(x)=F\\big[m_{t\\to r}(x),\\,x,\\,t,\\,r\\big] \\tag{2}$$<\/div>\n      <p>的场。对 \\(u\\)-预测的 flow matching，它就是 MeanFlow 的平均速度；对 EDM、DDIM、\\(x_1\\)-预测，它是各自预测量的\"累积版本\"。一个重要性质是<\/p>\n      <div class=\"display\">$$\\lim_{r\\to t}m_{t\\to r}(x)=m_t(x), \\tag{3}$$<\/div>\n      <p>即对角线退化为原来的瞬时量。这让训练更稳定，也允许从预训练的多步模型初始化，大幅加快训练。<\/p>\n      <p>训练时没有可以直接计算的参考 \\(m_{t\\to r}\\)（和导论里\"不能直接回归\"是同一个原因），所以论文给出了基于一致性关系的训练目标；实现上只需在时间嵌入里加入目标时间 \\(r\\)，网络容量不变。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>可以把它看成 MeanFlow 思想的\"参数化无关\"版本，代价是放弃了 MeanFlow 那种简洁的恒等式。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">3<\/span>应用<\/h2>\n      <div class=\"tablewrap\"><table class=\"cmp\">\n        <thead><tr><th>任务<\/th><th>基础参数化<\/th><th>步数<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td>几何分布建模<\/td><td>EDM<\/td><td>6 步，约 10× 加速且质量不降<\/td><\/tr>\n          <tr><td>关节预测<\/td><td>DDIM<\/td><td>10 步<\/td><\/tr>\n          <tr><td>64 个表面点稀疏条件下的 SDF 生成<\/td><td>\\(x_1\\)-FM<\/td><td>4 步<\/td><\/tr>\n          <tr><td>图像条件的草图生成<\/td><td>DDIM<\/td><td>1 步<\/td><\/tr>\n        <\/tbody>\n      <\/table><\/div>\n      <p>作者明确指出：评估只覆盖 5 个应用、4 种参数化，扩展到 ImageNet 等大规模数据是未来工作。<\/p>\n    <\/div>\n    <aside class=\"aside\"><\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>把多步模型统一为\"瞬时流映射\"，复合取极限得到累积流映射，天然满足半群。<\/span><\/li>\n      <li><span>累积参数化场对角线退化为原瞬时量，可从预训练模型初始化；只改时间嵌入与损失。<\/span><\/li>\n      <li><span>适用于 EDM、DDIM、\\(x_1\\)-预测等参数化，目前在图形学任务上验证。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "otnfm": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 15 讲 · 扩展 · 2026<\/p>\n    <h1>OT-NFM：<em>耦合决定能不能直接回归<\/em><\/h1>\n    <p class=\"lede\">直接用神经流参数化流映射、直接回归插值点，会塌缩到数据均值。论文证明一致的耦合是避免塌缩的必要条件，于是用最优传输配对噪声和数据，实现无 ODE 的一步生成。<\/p>\n    <div class=\"byline\"><span>arXiv <b><a href=\"https://arxiv.org/abs/2604.06413\" target=\"_blank\" rel=\"noopener\">2604.06413<\/a><\/b><\/span><span>实验 <b>合成数据、MNIST、CIFAR-10<\/b><\/span><\/div>\n    <div class=\"tagrow\"><span>直接回归<\/span><span>OT 耦合<\/span><span>神经流<\/span><\/div>\n  <\/div>\n  <aside class=\"aside\"><p><b>原文记号<\/b><\/p><p>\\(x_0\\sim p_0\\) 为噪声，\\(x_1\\sim p_1\\) 为数据；流映射 \\(F_\\theta(t,x_0)\\) 满足 \\(F_\\theta(0,x_0)=x_0\\)。<\/p><\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>朴素做法为什么塌缩<\/h2>\n      <p>神经流直接参数化映射本身。最朴素的训练是独立采样噪声和数据，回归插值点：<\/p>\n      <div class=\"display\">$$\\mathcal L_{\\text{naive}}=\\mathbb E_{x_0\\sim p_0,\\,x_1\\sim p_1,\\,t}\\big\\|F_\\theta(t,x_0)-x_t\\big\\|^2,\\qquad x_t=(1-t)x_0+tx_1. \\tag{1}$$<\/div>\n      <div class=\"thm\">\n        <div class=\"thm-label\">定理 1 <i>（均值坍缩）<\/i><\/div>\n        <p>独立耦合 \\(\\pi=p_0\\times p_1\\) 下，唯一的最优解是<\/p>\n        <div class=\"display\">$$F_{\\theta^\\ast}(t,x_0)=(1-t)\\,x_0+t\\,\\mathbb E_{p_1}[x_1],$$<\/div>\n        <p>特别地 \\(F_{\\theta^\\ast}(1,x_0)=\\mathbb E[x_1]\\)：所有生成样本都塌到数据均值。<\/p>\n      <\/div>\n      <p>这和导论第 2 节是同一件事：平方损失的最优解是条件期望，而独立耦合下 \\(x_1\\) 与 \\(x_0\\) 无关。速度可以这样学（条件期望恰好是边缘速度），映射不行。<\/p>\n    <\/div>\n    <aside class=\"aside\"><p>这也解释了为什么 flow matching 可以用独立耦合：它学的是条件期望意义下的速度，而不是映射。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>一致的耦合<\/h2>\n      <p>要让直接回归有意义，每个噪声 \\(x_0\\) 必须对应确定的一个数据点：耦合要\"一致\"（确定性）。作者证明这是非退化学习的<b>必要条件<\/b>，并采用最优传输配对：二次代价下的 OT 耦合是确定性的单调映射。实际中全局 OT 太贵，论文给出可扩展的小批量 OT 和在线耦合策略。<\/p>\n\n      <figure class=\"lab\" data-lab=\"coupling\">\n        <figcaption>一维例子：噪声是标准正态，数据是两个高斯团。把\"噪声 → 配对数据\"直接做非参数回归（相当于理想网络）。<b>独立耦合<\/b>下输出全部塌到 0；<b>小批量 OT<\/b> 下批越大，配对越接近全局 OT（一维时就是按分位数配对），输出分布越接近数据。<\/figcaption>\n      <\/figure>\n\n      <h3>结果与局限<\/h3>\n      <p>在合成数据、MNIST、CIFAR-10 上取得有竞争力的样本质量，推理只需一次前向。实验规模较小；OT 配对在高维、大数据集上的偏差和代价，是这条路线要回答的问题。<\/p>\n    <\/div>\n    <aside class=\"aside\">\n      <p>和 Rectified Flow 对照：ReFlow 用模型自己生成的配对重新训练，让耦合越来越一致、轨迹越来越直；OT-NFM 直接用 OT 给出一致的耦合。<\/p>\n      <p>离散数据的 Coupling Models 也持同样的观点：\"一步生成的效果很大程度上取决于解码前数据与噪声如何耦合。\"<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>小结<\/h2>\n    <ol>\n      <li><span>独立耦合下直接回归映射，最优解是数据均值。<\/span><\/li>\n      <li><span>一致（确定性）的耦合是非退化学习的必要条件；用小批量 OT 实现。<\/span><\/li>\n      <li><span>这是另一条路：不靠流映射的方程，而靠改耦合，让直接回归重新可行。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n", "summary": "<header class=\"row cover\">\n  <div class=\"main\">\n    <p class=\"eyebrow\">第 16 讲 · 收束<\/p>\n    <h1>总结：<em>一张对照表<\/em><\/h1>\n    <p class=\"lede\">把 15 篇论文放回导论的三个问题里：用了哪个方程，导数怎么算，目标里的噪声怎么处理。最后列出这条线还没解决的问题。<\/p>\n    <div class=\"byline\"><span>覆盖 <b>15 篇论文<\/b><\/span><\/div>\n  <\/div>\n  <aside class=\"aside\"><p>FID 均为 ImageNet 256、一步生成，训练设置各不相同，只能作为量级参考。<\/p><\/aside>\n<\/header>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">1<\/span>对照表<\/h2>\n      <div class=\"tablewrap\"><table class=\"cmp\">\n        <thead><tr><th>论文<\/th><th>方程<\/th><th>导数<\/th><th>老师<\/th><th>目标噪声的处理<\/th><th>一步 FID<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td>FMM<\/td><td>L / E / 直接训练<\/td><td>JVP<\/td><td>可有可无<\/td><td>—<\/td><td>—<\/td><\/tr>\n          <tr><td>Shortcut<\/td><td>半群<\/td><td>无<\/td><td>无<\/td><td>—<\/td><td>—<\/td><\/tr>\n          <tr><td>MeanFlow<\/td><td>E<\/td><td>JVP，切向量含 \\(v_{\\text{cond}}\\)<\/td><td>无<\/td><td>自适应权重<\/td><td>3.43<\/td><\/tr>\n          <tr><td>自蒸馏框架<\/td><td>L / E / 半群<\/td><td>JVP 或无<\/td><td>无<\/td><td>比较三类，LSD 最好<\/td><td>—<\/td><\/tr>\n          <tr><td>AYF<\/td><td>E（图像）/ L<\/td><td>JVP<\/td><td>预训练速度<\/td><td>老师速度无噪声<\/td><td>—<\/td><\/tr>\n          <tr><td>TVM<\/td><td>L<\/td><td>只对时间求导<\/td><td>无<\/td><td>条件速度不进 JVP<\/td><td>3.29<\/td><\/tr>\n          <tr><td>iMF<\/td><td>E<\/td><td>JVP，切向量用速度头<\/td><td>无<\/td><td>确定性切向量 + \\(v\\)-loss<\/td><td>1.72<\/td><\/tr>\n          <tr><td>pMF<\/td><td>E<\/td><td>JVP<\/td><td>无<\/td><td>同 iMF；\\(x\\)-预测<\/td><td>2.22（像素）<\/td><\/tr>\n          <tr><td>MF 方差削减<\/td><td>E<\/td><td>JVP<\/td><td>无<\/td><td>切向量混合 \\(\\beta\\) 的理论<\/td><td>—<\/td><\/tr>\n          <tr><td>ESC<\/td><td>E / 半群框架<\/td><td>JVP<\/td><td>无<\/td><td>plug-in 速度<\/td><td>2.85 / 2.53<\/td><\/tr>\n          <tr><td>TE-MeanFlow<\/td><td>E<\/td><td>JVP<\/td><td>无<\/td><td>按跨度均衡权重<\/td><td>2.62<\/td><\/tr>\n          <tr><td>SoFlow<\/td><td>E<\/td><td>有限差分<\/td><td>无<\/td><td>差分步长课程<\/td><td>2.96<\/td><\/tr>\n          <tr><td>EMF<\/td><td>半群（局部线性化）<\/td><td>有限差分<\/td><td>无<\/td><td>瞬时项用数据监督<\/td><td>—<\/td><\/tr>\n          <tr><td>Cumulative FM<\/td><td>半群<\/td><td>—<\/td><td>可选初始化<\/td><td>—<\/td><td>—<\/td><\/tr>\n          <tr><td>OT-NFM<\/td><td>直接回归<\/td><td>无<\/td><td>无<\/td><td>靠 OT 耦合避免塌缩<\/td><td>—<\/td><\/tr>\n        <\/tbody>\n      <\/table><\/div>\n    <\/div>\n    <aside class=\"aside\"><p>\"—\"表示论文没有在 ImageNet 256 上报告一步结果，或者那一栏不适用。<\/p><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">2<\/span>三条主线<\/h2>\n      <p><b>换方程。<\/b>从 Eulerian（MeanFlow）到 Lagrangian（TVM），条件速度不再进入 JVP；自蒸馏框架的实验和 TVM 的理论都支持这个方向。<\/p>\n      <p><b>处理目标噪声。<\/b>iMF 用确定性切向量，ESC 用整批估计，TE-MeanFlow 在跨度之间均衡，方差削减一文把它们统一到\"控制变量\"的视角下，同时提醒：方差最优不等于 FID 最优。<\/p>\n      <p><b>去掉 JVP。<\/b>SoFlow 与 EMF 用有限差分，代价是差分步长的选择；sCM、TVM、FACM 则选择写专门的 JVP 核硬扛。<\/p>\n    <\/div>\n    <aside class=\"aside\"><\/aside>\n  <\/div>\n<\/section>\n\n<section>\n  <div class=\"row\">\n    <div class=\"main\">\n      <h2><span class=\"num\">3<\/span>还没解决的问题<\/h2>\n      <ul class=\"plain\">\n        <li><b>flow map 还有优势吗？<\/b>2026 年的一步 SOTA 已经转到分布层面的方法（Drifting 1.54、W-Flow 1.29、Priming 1.19）。flow map 的独特之处在于可以自由选择步数、多步质量不退化；这一点能否转化为一步之外的实际优势，是值得做的对比实验。<\/li>\n        <li><b>Lagrangian 型的偏差。<\/b>TVM 用模型自己的落脚点取速度，引入偏差；它的代价与 Eulerian 型的方差相比到底怎样，目前缺少受控比较。<\/li>\n        <li><b>方差和质量的错配。<\/b>为什么 FID 偏好无偏的高方差目标？这可能和泛化、记忆化有关。<\/li>\n        <li><b>引导与条件生成。<\/b>CFG 写进训练目标或作为条件输入都是权宜之计；逆问题和奖励引导在一步模型里的形式还很初步。<\/li>\n        <li><b>规模化。<\/b>这条线大多停留在 ImageNet；只有 AYF（FLUX.1）、TVM（10B+）、FACM 等少数工作扩展到文生图或视频。<\/li>\n      <\/ul>\n      <p>如果要选一个适合动手的起点：在本讲义的二维例子上，把 MeanFlow、TVM、SoFlow 三种目标用同一个小 MLP 训练，比较训练曲线、目标方差和多步采样质量，就能把这条线的大部分结论亲手验证一遍。<\/p>\n    <\/div>\n    <aside class=\"aside\"><\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"row\">\n  <div class=\"main summary\">\n    <h2>全程小结<\/h2>\n    <ol>\n      <li><span>对象只有一个：流映射 / 平均速度；只有速度能从数据里无偏地学。<\/span><\/li>\n      <li><span>方法的差别归结为三个选择：方程、导数的算法、目标噪声的处理。<\/span><\/li>\n      <li><span>这条线正在从\"能训练\"走向\"训练得稳、算得省、用得广\"，而一步生成的最好成绩已经出现在分布层面的方法里。<\/span><\/li>\n    <\/ol>\n  <\/div>\n  <aside class=\"aside\"><\/aside>\n<\/section>\n"};

</script>
<script>
(function () {
  const CH = [
    ["导论", [["intro", "为什么要学流映射"]]],
    ["奠基", [["fmm", "Flow Map Matching"], ["shortcut", "Shortcut Models"], ["meanflow", "MeanFlow"], ["selfdistill", "自蒸馏框架"], ["ayf", "Align Your Flow"], ["tvm", "Terminal Velocity Matching"]]],
    ["修补 MeanFlow", [["imf", "Improved MeanFlow"], ["pmf", "Pixel MeanFlow"], ["mfvar", "MeanFlow 方差削减"], ["esc", "ESC"], ["temf", "TE-MeanFlow"]]],
    ["去掉 JVP 与扩展", [["soflow", "SoFlow"], ["emf", "Euler Mean Flows"], ["cumflow", "Cumulative Flow Maps"], ["otnfm", "OT-NFM"]]],
    ["收束", [["summary", "总结：一张对照表"]]]
  ];
  const FLAT = []; CH.forEach(([g, list]) => list.forEach(([id, name]) => FLAT.push({ id, name, group: g })));
  const railList = document.getElementById("railList"), sel = document.getElementById("chSelect");
  CH.forEach(([g, list]) => {
    railList.insertAdjacentHTML("beforeend", `<div class="rail-group">${g}</div>`);
    const og = document.createElement("optgroup"); og.label = g; sel.appendChild(og);
    list.forEach(([id, name]) => {
      const i = FLAT.findIndex(c => c.id === id);
      railList.insertAdjacentHTML("beforeend", `<a href="#${id}" data-id="${id}"><span class="n">${i}</span><span>${name}</span></a>`);
      const o = document.createElement("option"); o.value = id; o.textContent = `${i} · ${name}`; og.appendChild(o);
    });
  });
  sel.addEventListener("change", () => { location.hash = sel.value; });

  const root = document.getElementById("chapter");
  const cache = {};
  let current = null;
  function typeset(el) {
    const mj = window.MathJax;
    if (mj && mj.typesetPromise) {
      try { mj.texReset && mj.texReset(); mj.typesetClear && mj.typesetClear([el]); } catch (e) {}
      return mj.typesetPromise([el]).catch(() => {});
    }
    return new Promise(res => setTimeout(() => res(typeset(el)), 300));
  }
  async function load(id) {
    const i = FLAT.findIndex(c => c.id === id); if (i < 0) id = "intro";
    if (current === id) return;
    current = id;
    const idx = FLAT.findIndex(c => c.id === id);
    document.querySelectorAll("#railList a").forEach(a => { if (a.dataset.id === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    sel.value = id;
    root.innerHTML = `<p class="loading">正在载入讲义…</p>`;
    let html = cache[id] || (window.FLOWMAP_CHAPTERS || {})[id];
    if (!html) {
      try { const r = await fetch(`flowmap/ch/${id}.html`); if (!r.ok) throw new Error(r.status); html = await r.text(); cache[id] = html; }
      catch (e) { root.innerHTML = `<p class="loading">这一讲没有载入成功。如果是从本地打开的，请确认 flowmap 文件夹和本页面放在一起，或改用单文件版 flowmap_lectures_standalone.html。</p>`; return; }
    }
    if (current !== id) return;
    const prev = FLAT[idx - 1], next = FLAT[idx + 1];
    root.innerHTML = html + `<nav class="pager" aria-label="翻页">
      ${prev ? `<a class="prev" href="#${prev.id}"><span>← 上一讲 · 第 ${idx - 1} 讲</span><b>${prev.name}</b></a>` : "<span></span>"}
      ${next ? `<a class="next" href="#${next.id}"><span>下一讲 · 第 ${idx + 1} 讲 →</span><b>${next.name}</b></a>` : "<span></span>"}
    </nav><footer class="foot">记号统一为：z<sub>t</sub> = (1−t)x + tε，t=1 为噪声、t=0 为数据；各论文原始记号的差别在边注里说明。实验均为二维高斯混合上的精确计算。</footer>`;
    window.scrollTo(0, 0);
    await typeset(root);
    if (window.FlowLab) window.FlowLab.mountAll(root);
    document.title = `${FLAT[idx].name} · Flow Map 精读讲义`;
  }
  function fromHash() { const id = (location.hash || "").replace("#", ""); load(FLAT.some(c => c.id === id) ? id : "intro"); }
  window.addEventListener("hashchange", fromHash);
  fromHash();

  const bar = document.getElementById("bar");
  function onScroll() { const h = document.documentElement, max = h.scrollHeight - h.clientHeight; bar.style.width = (max > 0 ? h.scrollTop / max * 100 : 0) + "%"; }
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();
})();
</script>

</body></html>
